<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube クロン</title>
    <style>
        /* ==========================================
           共通の基本設定（ダークモードベース）
        ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Roboto", "Arial", sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }

        .icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: currentColor;
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
        }

        /* ==========================================
           ★ 再生リスト部分の共通スタイル
        ========================================== */
        /* カード全体をリンク(a)にしたため、テキスト装飾をリセット */
        .playlist-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        /* サムネイル画像のコンテナ */
        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #272727;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        /* 本物の画像が入る設定 */
        .thumbnail-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 動画本数バッジ */
        .video-count-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
        }

        /* テキスト・説明文エリア */
        .playlist-info h3 {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 4px;
            color: #fff;
        }

        .playlist-info p {
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
        }

        .view-all-link {
            color: #aaa;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            margin-top: 6px;
            display: inline-block;
        }
        .playlist-card:hover .view-all-link {
            color: #fff;
        }

        /* ==========================================
           1. スマートフォン用レイアウト (デフォルト)
        ========================================== */
        @media (max-width: 767px) {
            .pc-header, .pc-sidebar { display: none; }

            .sp-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 16px;
                position: sticky;
                top: 0;
                background-color: #0f0f0f;
                z-index: 100;
            }
            .sp-account-selector {
                background: #212121;
                padding: 6px 12px;
                border-radius: 18px;
                font-size: 14px;
                font-weight: bold;
            }
            .sp-header-icons { display: flex; gap: 18px; align-items: center; }
            .badge-icon { position: relative; }
            .badge {
                position: absolute; top: -4px; right: -4px; background: #cc0000;
                color: white; font-size: 10px; padding: 2px 5px; border-radius: 10px;
            }

            .sp-profile-section { display: flex; align-items: center; padding: 16px; gap: 16px; }
            .sp-avatar {
                width: 64px; height: 64px; background: #5f8492; border-radius: 50%;
                display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold;
            }
            .sp-profile-info h1 { font-size: 24px; margin-bottom: 4px; }
            .sp-profile-info p { color: #aaa; font-size: 13px; }

            .playlist-section { padding: 16px; }
            .section-title-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
            .section-title { font-size: 18px; font-weight: bold; }

            /* スマホ時は横スクロール */
            .playlist-grid {
                display: flex;
                gap: 12px;
                overflow-x: auto;
                padding-bottom: 8px;
            }
            .playlist-grid::-webkit-scrollbar { display: none; }
            .playlist-card { flex: 0 0 160px; }
            .thumbnail-container { border-radius: 8px; }
            .playlist-info h3 { font-size: 13px; font-weight: normal; }
            .playlist-info p { font-size: 11px; }

            .sp-menu-list { margin-top: 8px; border-top: 1px solid #272727; }
            .sp-menu-item { display: flex; align-items: center; gap: 16px; padding: 14px 16px; font-size: 14px; }

            .sp-bottom-nav {
                position: fixed; bottom: 0; left: 0; width: 100%; background: #0f0f0f;
                border-top: 1px solid #272727; display: flex; justify-content: space-around;
                padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); z-index: 100;
            }
            .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #aaa; text-decoration: none; gap: 4px; }
            .nav-item.active { color: #fff; }
            .nav-item-center { font-size: 32px; color: #fff; display: flex; align-items: center; justify-content: center; }
            body { padding-bottom: 70px; }
        }

        /* ==========================================
           2. PC用レイアウト (デスクトップ版)
        ========================================== */
        @media (min-width: 768px) {
            .sp-header, .sp-profile-section, .sp-bottom-nav, .sp-menu-list { display: none; }

            .pc-container {
                display: grid;
                grid-template-columns: 240px 1fr;
                grid-template-rows: 56px 1fr;
                grid-template-areas: "header header" "sidebar main";
                height: 100vh;
            }

            .pc-header {
                grid-area: header; background: #0f0f0f; display: flex;
                justify-content: space-between; align-items: center; padding: 0 16px;
                position: sticky; top: 0; z-index: 100;
            }
            .pc-header-left { display: flex; align-items: center; gap: 16px; }
            .pc-logo { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
            .pc-logo span { font-size: 10px; color: #aaa; margin-top: 4px; }
            .pc-header-center { display: flex; align-items: center; gap: 16px; flex: 0 1 600px; }
            .search-box-wrap {
                display: flex; width: 100%; background: #121212; border: 1px solid #303030;
                border-radius: 40px 0 0 40px; padding: 0 16px; height: 40px; align-items: center;
            }
            .search-box-wrap input { background: transparent; border: none; color: #fff; width: 100%; font-size: 16px; outline: none; }
            .search-btn { background: #222; border: 1px solid #303030; border-left: none; border-radius: 0 40px 40px 0; width: 64px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
            .mic-btn { background: #272727; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #fff; }
            .pc-header-right { display: flex; align-items: center; gap: 16px; }
            .pc-create-btn { background: #272727; padding: 8px 16px; border-radius: 18px; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
            .pc-avatar-btn { width: 32px; height: 32px; background: #c0007a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }

            .pc-sidebar { grid-area: sidebar; background: #0f0f0f; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
            .sidebar-item { display: flex; align-items: center; gap: 24px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: #fff; font-size: 14px; }
            .sidebar-item.active { background: #272727; font-weight: bold; }
            .sidebar-item:hover { background: #212121; }

            .pc-main { grid-area: main; overflow-y: auto; padding: 24px 48px; }

            .pc-profile-header { display: flex; align-items: center; gap: 24px; margin-bottom: 32px; }
            .pc-main-avatar { width: 128px; height: 128px; background: #c0007a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; }
            .pc-main-profile-info h1 { font-size: 36px; font-weight: bold; margin-bottom: 8px; }
            .pc-main-profile-info p { font-size: 14px; color: #aaa; margin-bottom: 16px; }
            .pc-profile-buttons { display: flex; gap: 8px; }
            .pc-btn { background: #272727; color: #fff; border: none; padding: 8px 16px; border-radius: 18px; font-size: 14px; font-weight: bold; cursor: pointer; }
            .pc-btn:hover { background: #3f3f3f; }

            .section-title-wrap { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; border-bottom: 1px solid #303030; padding-bottom: 16px; }
            .section-title { font-size: 20px; font-weight: bold; }
            .pc-controls { display: flex; gap: 4px; margin-left: auto; }
            .control-btn { background: transparent; border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
            .control-btn:hover { background: #272727; }

            /* PC時はタイル状に綺麗に並ぶ */
            .playlist-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 24px 16px;
            }
        }
    </style>
</head>
