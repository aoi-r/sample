<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Runner Game - Custom Sprite Edition</title>
<style>
html,body{ 
    margin:0; 
    padding:0; 
    width: 100%;
    height: 100%;
    overflow:hidden; 
    background:#0b1020; 
    font-family:sans-serif; 
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}

canvas{ 
    display:block; 
    width: 100% !important;
    height: 100% !important;
}

#score{ 
    position:fixed; 
    top: 20px; 
    left: 20px; 
    color:white; 
    font-size:24px; 
    z-index:10; 
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    pointer-events: none; 
}

#speed-display{
    position:fixed; 
    top: 20px; 
    right: 20px; 
    color: #00e5ff; 
    font-size:24px; 
    z-index:10; 
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    font-weight: bold;
    pointer-events: none;
}

#overlay{ 
    position:fixed; 
    inset:0; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    flex-direction:column; 
    color:white; 
    background:rgba(0,0,0,0.6); 
    z-index:20; 
    backdrop-filter: blur(4px); 
    -webkit-backdrop-filter: blur(4px); 
}
#overlay h1{ font-size:48px; margin:0; color: #00e5ff; text-shadow: 0 0 10px #00e5ff; }
#overlay p{ font-size:20px; }
</style>
</head>
<body>

<div id="score">SCORE : 0</div>
<div id="speed-display">SPEED : 40 km/h</div>

<div id="overlay">
    <h1>RUNNER</h1>
    <p>Tap to Start / Jump</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

<script>
const overlay = document.getElementById('overlay')
const scoreText = document.getElementById('score')
const speedText = document.getElementById('speed-display')

let WIDTH = window.innerWidth
let HEIGHT = window.innerHeight
let GROUND_Y = HEIGHT - 100 

let player
let grounds
let obstacles

let started = false
let gameOver = false
let jumpCount = 0
let score = 0
let speed = 400
let currentSpeedLevel = 0 

let triggerJumpFunction = null;

const SPEED_TABLE = [
    { threshold: 0,   speed: 400, display: 40,  minDelay: 1500, maxDelay: 3000 },
    { threshold: 50,  speed: 480, display: 60,  minDelay: 1200, maxDelay: 2500 },
    { threshold: 100, speed: 560, display: 80,  minDelay: 1000, maxDelay: 2000 },
    { threshold: 200, speed: 640, display: 100, minDelay: 800,  maxDelay: 1700 },
    { threshold: 400, speed: 720, display: 120, minDelay: 700,  maxDelay: 1400 },
    { threshold: 800, speed: 800, display: 140, minDelay: 600,  maxDelay: 1100 } 
]

class MainScene extends Phaser.Scene {

    constructor(){
        super('MainScene')
    }

    preload(){
        // ★【自作スプライトシートの読み込み設定】
        // 同じディレクトリにある 'runa.png' を読み込みます。
        // 解析した結果、1コマのサイズは横400px、縦600pxが最適です。
        this.load.spritesheet('player_run', 'runa.png', {
            frameWidth: 400,
            frameHeight: 600
        });
        
        // 障害物の画像
        this.load.image('spike', 'https://labs.phaser.io/assets/sprites/ufo.png')
        
        // 床のテクスチャを生成
        const g = this.make.graphics({x:0,y:0,add:false})
        g.fillStyle(0x111827)
        g.fillRect(0,0,120,60)
        g.lineStyle(2, 0x00e5ff, 0.5)
        g.strokeRect(0,0,120,60)
        g.generateTexture('ground',120,60)
        g.destroy()
    }

    create(){
        started = false
        gameOver = false
        jumpCount = 0
        score = 0
        speed = SPEED_TABLE[0].speed
        currentSpeedLevel = 0
        
        scoreText.textContent = 'SCORE : 0'
        speedText.textContent = `SPEED : ${SPEED_TABLE[0].display} km/h`
        
        overlay.innerHTML = `
            <h1>SPEED RUN</h1>
            <p>Tap to Jump</p>
        `
        overlay.style.display = 'flex'

        this.cameras.main.setBackgroundColor('#0b1020')

        grounds = this.physics.add.group()
        for(let i=0; i<30; i++){
            const ground = grounds.create(i*120, GROUND_Y, 'ground').setOrigin(0,0)
            ground.body.allowGravity = false
            ground.body.setImmovable(true)
        }

        // プレイヤーの作成
        player = this.physics.add.sprite(150, GROUND_Y - 120, 'player_run')
        // 元画像が大きいので、ゲーム画面に合うようにリサイズ（横60px、縦90px）
        player.setDisplaySize(60, 90) 
        player.setGravityY(2200) 

        // ★当たり判定（物理ボディ）のサイズ調整
        // 画像の余白が大きいため、キャラクターの実体に合わせた当たり判定にギュッと狭めます
        player.body.setSize(200, 500)
        player.body.setOffset(100, 50)

        // ★走るアニメーション登録（2コマ目と3コマ目をループさせる）
        if (!this.anims.exists('run_dash')) {
            this.anims.create({
                key: 'run_dash',
                frames: this.anims.generateFrameNumbers('player_run', { start: 1, end: 2 }),
                frameRate: 8, // アニメーションの速度（好みに合わせて変えてね）
                repeat: -1     
            });
        }
        player.anims.play('run_dash', true);

        // 衝突判定
        this.physics.add.collider(player, grounds, (p, g)=>{
            if(p.body.touching.down){
                jumpCount = 0
                if(started && !gameOver && !player.anims.isPlaying) {
                    player.anims.play('run_dash', true);
                }
            }
        })

        obstacles = this.physics.add.group()
        this.physics.add.overlap(player, obstacles, ()=>{ this.dead() })

        // ジャンプ・スタート関数
        triggerJumpFunction = () => {
            if(gameOver) {
                triggerJumpFunction = null;
                this.scene.restart();
            } else {
                if(!started) {
                    started = true;
                    overlay.style.display = 'none';
                }
                if(jumpCount < 2){
                    player.setVelocityY(-780); 
                    jumpCount++;
                    
                    // ジャンプ中は1コマ目（足を前に出して飛んでいるポーズ）に固定
                    player.anims.stop();
                    player.setFrame(1); 
                }
            }
        };

        // キーボード操作
        this.input.keyboard.off('keydown-SPACE')
        this.input.keyboard.on('keydown-SPACE',()=>{
            if(triggerJumpFunction) triggerJumpFunction();
        })

        this.obstacleTimer = this.time.addEvent({
            delay: Phaser.Math.Between(SPEED_TABLE[0].minDelay, SPEED_TABLE[0].maxDelay),
            callback: this.spawnObstacleGenerator,
            callbackScope: this,
            loop: true
        })

        this.time.addEvent({
            delay: 4500, 
            callback: this.makeHole,
            callbackScope: this,
            loop: true
        })
    }

    update(time, delta){
        if(!started || gameOver) return

        score += delta * 0.01
        scoreText.textContent = 'SCORE : ' + Math.floor(score)

        this.checkSpeedUp()

        if(player.y > GROUND_Y + 50){
            this.dead()
            return
        }

        grounds.getChildren().forEach((ground)=>{
            ground.x -= speed * delta / 1000
            if(ground.x <= -120){
                let maxX = 0
                grounds.getChildren().forEach((g)=>{ if(g.x > maxX) maxX = g.x })
                ground.x = maxX + 120
                ground.y = GROUND_Y 
            }
        })

        obstacles.getChildren().forEach((obj)=>{
            obj.x -= speed * delta / 1000
            obj.angle += 2 
            if(obj.x < -100){ obj.destroy() }
        })
    }

    checkSpeedUp() {
        const nextLevel = currentSpeedLevel + 1;
        if (SPEED_TABLE[nextLevel] && score >= SPEED_TABLE[nextLevel].threshold) {
            currentSpeedLevel = nextLevel;
            speed = SPEED_TABLE[currentSpeedLevel].speed;
            speedText.textContent = `SPEED : ${SPEED_TABLE[currentSpeedLevel].display} km/h`;
        }
    }

    spawnObstacleGenerator() {
        if(!started || gameOver) return
        const count = Phaser.Math.Between(1, 3)
        const baseOffset = this.sys.game.config.width + 100

        for(let i = 0; i < count; i++) {
            const spike = obstacles.create(baseOffset + (i * 45), GROUND_Y - 30, 'spike')
            spike.setDisplaySize(40, 40)
            spike.body.allowGravity = false
            spike.body.setImmovable(true)
            spike.body.setSize(30, 30) 
        }

        const config = SPEED_TABLE[currentSpeedLevel];
        this.obstacleTimer.delay = Phaser.Math.Between(config.minDelay, config.maxDelay);
    }

    makeHole(){
        if(!started || gameOver) return
        const screenWidth = this.sys.game.config.width
        const validGrounds = grounds.getChildren().filter(g => g.x > screenWidth + 100 && g.y === GROUND_Y)
        if(validGrounds.length < 3) return

        const randomIndex = Phaser.Math.Between(0, validGrounds.length - 3)
        const target1 = validGrounds[randomIndex]
        const target2 = validGrounds[randomIndex + 1]

        if(!target1 || !target2) return
        target1.y += 600
        target2.y += 600
    }

    dead(){
        if(gameOver) return
        gameOver = true
        this.physics.pause()
        player.anims.stop();
        player.setFrame(0); // 終了時は立ちポーズ

        overlay.innerHTML = `
            <h1>GAME OVER</h1>
            <p>SCORE : ${Math.floor(score)}</p>
            <p>Tap to Retry</p>
        `
        overlay.style.display = 'flex'
    }
}

window.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) e.preventDefault(); 
    if(triggerJumpFunction) {
        triggerJumpFunction();
    }
}, { passive: false });

window.addEventListener('mousedown', () => {
    if(triggerJumpFunction) triggerJumpFunction();
});

const config = {
    type: Phaser.AUTO,
    width: WIDTH,
    height: HEIGHT,
    physics: {
        default: 'arcade',
        arcade: { gravity: {y: 0}, debug: false }
    },
    scale: { 
        mode: Phaser.Scale.RESIZE, 
        autoCenter: Phaser.Scale.CENTER_BOTH 
    },
    scene: [MainScene]
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
