<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Salaryman Runner</title>

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background: linear-gradient(#87ceeb,#e6f7ff);
    font-family:sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

.ui{
    position:absolute;
    top:10px;
    left:10px;
    padding:10px 14px;
    background:rgba(0,0,0,0.35);
    color:#fff;
    border-radius:12px;
    backdrop-filter: blur(6px);
    font-size:15px;
}

#speedUp{
    position:absolute;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:48px;
    font-weight:bold;
    color:#fff;
    display:none;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#fff;
    display:none;
    text-align:center;
}
#gameOver h1{font-size:48px;margin:0;}
</style>
</head>

<body>

<audio id="bgm" src="famipop3.mp3" loop></audio>

<canvas id="game"></canvas>

<div class="ui" id="ui"></div>
<div id="speedUp">SPEED UP!</div>
<div id="gameOver">
<h1>GAME OVER</h1>
<p>Tap / Space to Restart</p>
</div>

<script>

// =====================
// 基本
// =====================
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const ui=document.getElementById("ui");
const speedUpUI=document.getElementById("speedUp");
const gameOverUI=document.getElementById("gameOver");

const bgm=document.getElementById("bgm");
bgm.volume=0.35;

const isMobile=innerWidth<768;

function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

// =====================
// スプライト
// =====================
function load(prefix,count){
    const arr=[];
    for(let i=1;i<=count;i++){
        const img=new Image();
        img.src=`sala_img/${prefix}${i}.png`;
        arr.push(img);
    }
    return arr;
}

const run=load("run",8);
const jump=load("jump",6);
const dead=load("dead",6);

//======================
//障害物・・・
//======================
const bill = new Image();
bill.src = "sala_img/bill.png";


// =====================
// プレイヤー
// =====================
const player={
    x:isMobile?70:120,
    y:0,
    w:isMobile?72:96,
    h:isMobile?72:96,
    vy:0,
    g:0.85,
    jp:isMobile?-16:-18,

    onGround:false,
    coyote:0,
    buffer:0,

    jumpCount:0,
    maxJump:2,

    dead:false,
    deadFrame:0 // 死亡アニメーション専用のカウンタ
};

const ground=()=>canvas.height-(isMobile?110:140);

// =====================
// 入力
// =====================
let audioStart=false;
let tapLock=false;

function startBGM(){
    if(audioStart) return;
    audioStart=true;
    bgm.play().catch(()=>{});
}

function requestJump(){
    player.buffer=8;
}

function doJump(){
    player.jumpCount++;

    if(player.jumpCount===1) player.vy=player.jp;
    if(player.jumpCount===2) player.vy=player.jp*1.15;

    player.onGround=false;
    player.coyote=0;
}

function tap(){
    startBGM();

    if(tapLock) return;
    tapLock=true;

    if(player.dead){
        restart();
    }else{
        requestJump();
    }

    setTimeout(()=>tapLock=false,80);
}

addEventListener("mousedown",tap);
addEventListener("touchstart",tap,{passive:true});

addEventListener("keydown",e=>{
    if(e.code==="Space"){
        startBGM();
        if(player.dead) restart();
        else requestJump();
    }
});

// =====================
// 状態
// =====================
let score=0;
let speed=6;
let frame=0;
let ft=0;
let speedLv=1;

// =====================
// 障害物
// =====================
const obs=[];

function spawn(){
    const r=Math.random();
    const gnd=ground();

    // 🟤 通常障害物 (25%)
    if(r<0.25){
        obs.push({
            t:"brown",
            x:canvas.width+100,
            y:gnd-60,
            w:60,
            h:60
        });
    }
    // 🟢 緑：2段ジャンプ必須 (25%)
    else if(r<0.50){
        obs.push({
            t:"green",
            x:canvas.width+100,
            y:gnd-140,
            w:70,
            h:140
        });
    }
    // 🩷 ピンク：天井トラップ (25%)
    else if(r<0.75){
        obs.push({
            t:"pink",
            x:canvas.width+100,
            y:0,
            w:100,
            h:gnd-110
        });
    }
    // 🕳️ 空白：落とし穴 (25%)
    else {
        obs.push({
            t:"pit",
            x:canvas.width+100,
            y:gnd,
            w:isMobile?120:160,
            h:300
        });
    }
}

setInterval(()=>{if(!player.dead)spawn();},1400);

// =====================
// 死亡
// =====================
function kill(){
    if(player.dead) return;
    player.dead=true;
    player.deadFrame=0; // 死亡アニメーションを最初のコマから再生
    bgm.volume=0.1;
    gameOverUI.style.display="block";
}

// =====================
// リスタート
// =====================
function restart(){
    player.dead=false;
    player.deadFrame=0;
    player.vy=0;
    player.y=ground()-player.h;

    player.jumpCount=0;
    player.buffer=0;
    player.onGround=true;

    obs.length=0;
    score=0;

    speed=6;
    speedLv=1;

    frame=0;
    ft=0;

    gameOverUI.style.display="none";
    bgm.volume=0.35;
}

// =====================
// 当たり判定
// =====================
function hit(a,b){
    return a.x<b.x+b.w &&
           a.x+a.w>b.x &&
           a.y<b.y+b.h &&
           a.y+a.h>b.y;
}

// =====================
// 更新
// =====================
function update(){

    // ゲームオーバー時でも、死亡アニメーションを進めるために処理を一部継続
    if(player.dead) {
        ft++;
        if(ft>6){ // アニメーション速度の調整
            ft=0;
            // 最後のコマ（dead.length - 1）に達したらそこでストップ（ループさせない）
            if(player.deadFrame < dead.length - 1){
                player.deadFrame++;
            }
        }
        return;
    }

    score+=0.1;

    const next=Math.floor(score/100)+1;
    if(next>speedLv){
        speedLv=next;
        speed++;
        speedUpUI.style.display="block";
        setTimeout(()=>speedUpUI.style.display="none",600);
    }

    speed+=0.0008;

    player.vy+=player.g;
    player.y+=player.vy;

    // プレイヤーの足元中央のX座標（落とし穴判定用）
    const playerFootX = player.x + player.w / 2;
    let overPit = false;

    // 障害物の移動と判定
    for(let i=obs.length-1;i>=0;i--){
        const o=obs[i];
        o.x-=speed;

        const hb={
            x:player.x+12,
            y:player.y+10,
            w:player.w-24,
            h:player.h-20
        };

        // 🟤 通常障害物
        if(o.t==="brown"){
            if(hit(hb,o)) kill();
        }
        // 🟢 2段ジャンプ必須
        else if(o.t==="green"){
            if(hit(hb,o) && player.jumpCount < 2) kill();
        }
        // 🩷 天井トラップ
        else if(o.t==="pink"){
            const inAir = !player.onGround;
            if(hit(hb,o) && inAir) kill();
        }
        // 🕳️ 落とし穴判定
        else if(o.t==="pit"){
            if(playerFootX > o.x && playerFootX < o.x + o.w){
                overPit = true;
            }
        }

        if(o.x<-200) obs.splice(i,1);
    }

    // 着地・落下の処理
    const gndY = ground();
    
    if(overPit){
        player.onGround = false;
        player.coyote = 0;

        if(player.y >= gndY - player.h / 2){
            kill();
        }
    } else {
        // 通常の地面での着地処理
        if(player.y >= gndY - player.h && player.y - player.vy <= gndY - player.h + 20){
            player.y = gndY - player.h;
            player.vy = 0;

            player.onGround = true;
            player.coyote = 6;
            player.jumpCount = 0;
        }
    }

    if(player.buffer>0)player.buffer--;

    if(player.buffer>0 && (player.coyote>0 || player.jumpCount<player.maxJump)){
        doJump();
        player.buffer=0;
    }

    // 通常時のフレームカウント
    ft++;
    if(ft>5){ // 走る・ジャンプのアニメーション速度（数字が小さいほど速い）
        ft=0;
        frame++;
    }

    ui.innerHTML=
        `SCORE: ${Math.floor(score)}<br>`+
        `SPEED: ${speedLv}`;
}

// =====================
// 描画
// =====================
function draw(){

    ctx.fillStyle="#87ceeb";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // --- 地面の切り抜き描画（落とし穴を表現） ---
    const gndY = ground();
    const gndH = canvas.height - gndY;
    
    const pits = obs.filter(o => o.t === "pit").sort((a, b) => a.x - b.x);
    
    let currentX = 0;
    ctx.fillStyle="#66bb55";

    pits.forEach(pit => {
        if(pit.x > currentX){
            ctx.fillRect(currentX, gndY, pit.x - currentX, gndH);
        }
        currentX = Math.max(currentX, pit.x + pit.w);
    });

    if(currentX < canvas.width){
        ctx.fillRect(currentX, gndY, canvas.width - currentX, gndH);
    }
    // ------------------------------------------

    // 障害物の描画
    obs.forEach(o=>{
        if(o.t==="brown"){
		//ctx.fillStyle="#8b4513";
		ctx.drawImage(bill,o.x,o.y,o.w,o.h);
	}
        if(o.t==="green") ctx.fillStyle="#3cb371";

        if(o.t==="brown" || o.t==="green"){
            ctx.fillRect(o.x,o.y,o.w,o.h);
        }

        // 🩷 ピンク（天井から垂れる物理判定）
        if(o.t==="pink"){
            ctx.fillStyle="#ff4fa3";
            ctx.fillRect(o.x,o.y,o.w,o.h);

            // 天井接続
            ctx.fillStyle="#ff7abf";
            ctx.fillRect(o.x,0,o.w,10);
        }
        // 🕳️ 落とし穴
        if(o.t==="pit"){
            ctx.fillStyle="#87ceeb";
            ctx.fillRect(o.x, o.y, o.w, o.h);
        }
    });

    let img;

    if(player.dead) {
        // 死亡時はループさせず、計算されたdeadFrameのコマをそのまま表示
        img = dead[player.deadFrame];
    } else if(!player.onGround) {
        // ジャンプ中も一瞬で終わらないよう、ジャンプ画像の枚数（6枚）で適切にループ
        img = jump[frame % jump.length];
    } else {
        // 通常走行（8枚）でループ
        img = run[frame % run.length];
    }

    ctx.drawImage(img,player.x,player.y,player.w,player.h);
}

// =====================
// ループ
// =====================
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();

</script>

</body>
</html>
