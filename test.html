<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Runner Game - iPhone Optimized</title>
<style>
    body { margin: 0; padding: 0; background: #0b1020; overflow: hidden; }
    #game-container { width: 100vw; height: 100vh; overflow: hidden; }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
<script>
// iPhone Safari対策：画面サイズを固定
const config = {
    type: Phaser.WEBGL,
    parent: 'game-container',
    width: 800, // 内部の論理サイズを固定
    height: 600,
    physics: { default: 'arcade', arcade: { gravity: { y: 2000 }, debug: false } },
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    scene: { preload, create, update }
};

const game = new Phaser.Game(config);

let player, grounds, obstacles, score = 0, started = false, gameOver = false;

function preload() {
    this.load.spritesheet('player', 'runa.png', { frameWidth: 256, frameHeight: 360 });
    this.load.image('ground', 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==');
}

function create() {
    this.cameras.main.setBackgroundColor('#0b1020');
    
    // 地面生成
    grounds = this.physics.add.staticGroup();
    for(let i=0; i<10; i++) grounds.create(i*160, 550, 'ground').setScale(160, 100).refreshBody();

    // プレイヤー：ここがポイント。表示サイズをPhysicsとは別に管理
    player = this.physics.add.sprite(150, 300, 'player');
    player.setScale(0.3); // 256x360を縮小
    player.body.setSize(100, 280); // 当たり判定のみ指定
    player.body.setOffset(78, 40);
    player.setCollideWorldBounds(true);

    this.anims.create({ key: 'run', frames: this.anims.generateFrameNumbers('player', { start: 0, end: 3 }), frameRate: 10, repeat: -1 });
    player.anims.play('run');

    this.input.on('pointerdown', jump, this);
    this.input.keyboard.on('keydown-SPACE', jump, this);
}

function jump() {
    if(!started) started = true;
    if(player.body.touching.down) {
        player.setVelocityY(-900);
        player.setFrame(7); // ジャンプポーズへ切り替え
    }
}

function update() {
    if(started && player.body.touching.down) player.anims.play('run', true);
}
</script>
</body>
</html>
