<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Runner Game - Mobile Edition</title>
<style>
/* 画面全体のスクロールや引っ張りを完全に禁止するおまじない */
html,body{ 
    margin:0; 
    padding:0; 
    width: 100%;
    height: 100%;
    overflow:hidden; 
    background:#0b1020; 
    position: fixed; /* iPhoneのバウンス（引っ張り）を強制ストップ */
    touch-action: none; /* ブラウザ標準のズームやスクロールをすべて無効化 */
    -webkit-text-size-adjust: 100%;
    font-family:sans-serif; 
}

canvas{ 
    display:block; 
    width: 100% !important;
    height: 100% !important;
}

/* スコア（文字サイズを少しスマホ向けに調整） */
#score{ 
    position:fixed; 
    top: 20px; 
    left: 20px; 
    color:white; 
    font-size:24px; 
    z-index:10; 
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    pointer-events: none; /* タッチイベントがゲームに届くように透過 */
}

/* 速度表記 */
#speed-display{
    position:fixed; 
    top: 20px; 
    right: 20px; 
    color: #00e5ff; 
    font-size:24px; 
    z-index:10; 
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    font-weight: bold;
    pointer-events: none;
}

#overlay{ 
    position:fixed; 
    inset:0; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    flex-direction:column; 
    color:white; 
    background:rgba(0,0,0,0.6); 
    z-index:20; 
    backdrop-filter: blur(4px); 
    -webkit-backdrop-filter: blur(4px); /* Safari対応 */
    user-select: none;
    -webkit-user-select: none;
}
#overlay h1{ font-size:48px; margin:0; color: #00e5ff; text-shadow: 0 0 10px #00e5ff; }
#overlay p{ font-size:20px; }
</style>
</head>
<body>

<div id="score">SCORE : 0</div>
<div id="speed-display">SPEED : 40 km/h</div>

<div id="overlay">
    <h1>RUNNER</h1>
    <p>Tap to Start / Jump</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

<script>
const overlay = document.getElementById('overlay')
const scoreText = document.getElementById('score')
const speedText = document.getElementById('speed-display')

// スマホの画面の向き（リサイズ）に追従させるためのリアルタイムサイズ取得
let WIDTH = window.innerWidth
let HEIGHT = window.innerHeight
let GROUND_Y = HEIGHT - 100 

let player
let grounds
let obstacles

let started = false
let gameOver = false
let jumpCount = 0
let score = 0
let speed = 400
let currentSpeedLevel = 0 

const SPEED_TABLE = [
    { threshold: 0,   speed: 400, display: 40,  minDelay: 1500, maxDelay: 3000 },
    { threshold: 50,  speed: 480, display: 60,  minDelay: 1200, maxDelay: 2500 },
    { threshold: 100, speed: 560, display: 80,  minDelay: 1000, maxDelay: 2000 },
    { threshold: 200, speed: 640, display: 100, minDelay: 800,  maxDelay: 1700 },
    { threshold: 400, speed: 720, display: 120, minDelay: 700,  maxDelay: 1400 },
    { threshold: 800, speed: 800, display: 140, minDelay: 600,  maxDelay: 1100 } 
]

class MainScene extends Phaser.Scene {

    constructor(){
        super('MainScene')
    }

    preload(){
        this.load.crossOrigin = 'anonymous';

        this.load.spritesheet('player_run', 'https://labs.phaser.io/assets/sprites/dude.png', {
            frameWidth: 32,
            frameHeight: 48
        });
        
        this.load.image('spike', 'https://labs.phaser.io/assets/sprites/ufo.png')
        
        const g = this.make.graphics({x:0,y:0,add:false})
        g.fillStyle(0x111827)
        g.fillRect(0,0,120,60)
        g.lineStyle(2, 0x00e5ff, 0.5)
        g.strokeRect(0,0,120,60)
        g.generateTexture('ground',120,60)
        g.destroy()
    }

    create(){
        started = false
        gameOver = false
        jumpCount = 0
        score = 0
        speed = SPEED_TABLE[0].speed
        currentSpeedLevel = 0
        
        scoreText.textContent = 'SCORE : 0'
        speedText.textContent = `SPEED : ${SPEED_TABLE[0].display} km/h`
        
        overlay.innerHTML = `
            <h1>SPEED RUN</h1>
            <p>Tap to Jump</p>
        `
        overlay.style.display = 'flex'

        this.cameras.main.setBackgroundColor('#0b1020')

        // 画面サイズを現在のブラウザサイズに再適応
        WIDTH = this.sys.game.config.width
        HEIGHT = this.sys.game.config.height
        GROUND_Y = HEIGHT - 100

        grounds = this.physics.add.group()
        // 画面外まで床をしっかり敷き詰める（スマホの横長・縦長両対応のために多めに配置）
        for(let i=0; i<30; i++){
            const ground = grounds.create(i*120, GROUND_Y, 'ground').setOrigin(0,0)
            ground.body.allowGravity = false
            ground.body.setImmovable(true)
        }

        player = this.physics.add.sprite(150, GROUND_Y - 100, 'player_run') // 少し左寄りに配置して見やすく
        player.setDisplaySize(50, 70) 
        player.setGravityY(2000) // スマホの狭い画面でも快適に遊べるよう重力を少し強めに微調整   

        if (!this.anims.exists('run')) {
            this.anims.create({
                key: 'run',
                frames: this.anims.generateFrameNumbers('player_run', { start: 5, end: 8 }),
                frameRate: 12, 
                repeat: -1     
            });
        }
        player.anims.play('run', true);

        this.physics.add.collider(player, grounds, (p, g)=>{
            if(p.body.touching.down){
                jumpCount = 0
                if(started && !gameOver) player.anims.play('run', true);
            }
        })

        obstacles = this.physics.add.group()
        this.physics.add.overlap(player, obstacles, ()=>{ this.dead() })

        // ★スマホの「画面タッチ（pointerdown）」に完全最適化
        this.input.off('pointerdown')
        this.input.on('pointerdown',()=>{
            if(gameOver) this.scene.restart()
            else { this.startGame(); this.jump(); }
        })

        // PC用のキーボード操作も残しておく
        this.input.keyboard.off('keydown-SPACE')
        this.input.keyboard.on('keydown-SPACE',()=>{
            if(gameOver) this.scene.restart()
            else { this.startGame(); this.jump(); }
        })

        this.obstacleTimer = this.time.addEvent({
            delay: Phaser.Math.Between(SPEED_TABLE[0].minDelay, SPEED_TABLE[0].maxDelay),
            callback: this.spawnObstacleGenerator,
            callbackScope: this,
            loop: true
        })

        this.time.addEvent({
            delay: 4500, 
            callback: this.makeHole,
            callbackScope: this,
            loop: true
        })
    }

    update(time, delta){
        if(!started || gameOver) return

        score += delta * 0.01
        scoreText.textContent = 'SCORE : ' + Math.floor(score)

        this.checkSpeedUp()

        // 落下判定（スマホの画面サイズに合わせて厳密に）
        if(player.y > GROUND_Y + 20){
            this.dead()
            return
        }

        grounds.getChildren().forEach((ground)=>{
            ground.x -= speed * delta / 1000
            if(ground.x <= -120){
                let maxX = 0
                grounds.getChildren().forEach((g)=>{ if(g.x > maxX) maxX = g.x })
                ground.x = maxX + 120
                ground.y = GROUND_Y 
            }
        })

        obstacles.getChildren().forEach((obj)=>{
            obj.x -= speed * delta / 1000
            obj.angle += 2 
            if(obj.x < -100){ obj.destroy() }
        })
    }

    checkSpeedUp() {
        const nextLevel = currentSpeedLevel + 1;
        if (SPEED_TABLE[nextLevel] && score >= SPEED_TABLE[nextLevel].threshold) {
            currentSpeedLevel = nextLevel;
            speed = SPEED_TABLE[currentSpeedLevel].speed;
            speedText.textContent = `SPEED : ${SPEED_TABLE[currentSpeedLevel].display} km/h`;
        }
    }

    startGame(){
        if(started) return
        started = true
        overlay.style.display = 'none'
    }

    jump(){
        if(gameOver || !started) return

        if(jumpCount < 2){
            player.setVelocityY(-720) // 重力に合わせてジャンプ力も少しだけ強化
            jumpCount++
            player.anims.stop();
        }
    }

    spawnObstacleGenerator() {
        if(!started || gameOver) return

        const count = Phaser.Math.Between(1, 3)
        // スマホの画面の右外（WIDTH）から正確に出現させる
        const baseOffset = this.sys.game.config.width + 100

        for(let i = 0; i < count; i++) {
            const spike = obstacles.create(baseOffset + (i * 45), GROUND_Y - 30, 'spike')
            spike.setDisplaySize(40, 40)
            spike.body.allowGravity = false
            spike.body.setImmovable(true)
            spike.body.setSize(30, 30) 
        }

        const config = SPEED_TABLE[currentSpeedLevel];
        this.obstacleTimer.delay = Phaser.Math.Between(config.minDelay, config.maxDelay);
    }

    makeHole(){
        if(!started || gameOver) return

        const screenWidth = this.sys.game.config.width
        const validGrounds = grounds.getChildren().filter(g => g.x > screenWidth + 100 && g.y === GROUND_Y)
        if(validGrounds.length < 3) return

        const randomIndex = Phaser.Math.Between(0, validGrounds.length - 3)
        const target1 = validGrounds[randomIndex]
        const target2 = validGrounds[randomIndex + 1]

        if(!target1 || !target2) return
        target1.y += 600
        target2.y += 600
    }

    dead(){
        if(gameOver) return
        gameOver = true
        this.physics.pause()
        player.anims.stop();

        overlay.innerHTML = `
            <h1>GAME OVER</h1>
            <p>SCORE : ${Math.floor(score)}</p>
            <p>Tap to Retry</p>
        `
        overlay.style.display = 'flex'
    }
}

new Phaser.Game({
    type: Phaser.AUTO,
    width: WIDTH,
    height: HEIGHT,
    physics: {
        default: 'arcade',
        arcade: { gravity: {y: 0}, debug: false }
    },
    // RESIZEモードでスマホの縦向き・横向き・画面サイズ変化に自動追従
    scale: { 
        mode: Phaser.Scale.RESIZE, 
        autoCenter: Phaser.Scale.CENTER_BOTH 
    },
    scene: [MainScene]
})
</script>
</body>
</html>
