<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Runner Game - Perfection Edition</title>
<style>
html,body{ margin:0; padding:0; width: 100%; height: 100%; overflow:hidden; background:#0b1020; font-family:sans-serif; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
canvas{ display:block; width: 100% !important; height: 100% !important; }
#score{ position:fixed; top: 20px; left: 20px; color:white; font-size:24px; z-index:10; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none; }
#speed-display{ position:fixed; top: 20px; right: 20px; color: #00e5ff; font-size:24px; z-index:10; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); font-weight: bold; pointer-events: none; }
#overlay{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; color:white; background:rgba(0,0,0,0.6); z-index:20; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
#overlay h1{ font-size:48px; margin:0; color: #00e5ff; text-shadow: 0 0 10px #00e5ff; padding-bottom: 10px; }
#overlay p{ font-size:20px; margin: 5px 0; color: #ffffff; }
</style>
</head>
<body>

<div id="score">SCORE : 0</div>
<div id="speed-display">SPEED : 40 km/h</div>

<div id="overlay">
    <h1>RUNNER</h1>
    <p>Press SPACE Key or Tap Screen</p>
    <p style="font-size: 14px; color: #888;">(ゲーム画面をクリックしてからスペースを押してください)</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

<script>
const overlay = document.getElementById('overlay')
const scoreText = document.getElementById('score')
const speedText = document.getElementById('speed-display')

let WIDTH = window.innerWidth
let HEIGHT = window.innerHeight
let GROUND_Y = HEIGHT - 100 

let player
let grounds
let obstacles

let started = false
let gameOver = false
let jumpCount = 0
let score = 0
let speed = 400
let currentSpeedLevel = 0 

let triggerJumpFunction = null;

const SPEED_TABLE = [
    { threshold: 0,   speed: 400, display: 40,  minDelay: 1500, maxDelay: 3000 },
    { threshold: 50,  speed: 480, display: 60,  minDelay: 1200, maxDelay: 2500 },
    { threshold: 100, speed: 560, display: 80,  minDelay: 1000, maxDelay: 2000 },
    { threshold: 200, speed: 640, display: 100, minDelay: 800,  maxDelay: 1700 },
    { threshold: 400, speed: 720, display: 120, minDelay: 700,  maxDelay: 1400 },
    { threshold: 800, speed: 800, display: 140, minDelay: 600,  maxDelay: 1100 } 
]

class MainScene extends Phaser.Scene {

    constructor(){
        super('MainScene')
    }

    preload(){
        // 画像の切り出しサイズ（横256、縦360）はそのまま
        this.load.spritesheet('player_run', 'runa.png', {
            frameWidth: 256,
            frameHeight: 360
        });
        
        // ★【ここを修正】外部URLからの読み込みをやめ、プログラムで生成した赤い四角を障害物にします
        const g = this.make.graphics({x:0,y:0,add:false})
        g.fillStyle(0xff3333) // 障害物を赤い四角に
        g.fillRect(0,0,40,40)
        g.generateTexture('spike',40,40)
        g.clear()

        // 地面タイル
        g.fillStyle(0x111827)
        g.fillRect(0,0,120,60)
        g.lineStyle(2, 0x00e5ff, 0.5)
        g.strokeRect(0,0,120,60)
        g.generateTexture('ground',120,60)
        g.destroy()
    }

    create(){
        started = false
        gameOver = false
        jumpCount = 0
        score = 0
        speed = SPEED_TABLE[0].speed
        currentSpeedLevel = 0
        
        scoreText.textContent = 'SCORE : 0'
        speedText.textContent = `SPEED : ${SPEED_TABLE[0].display} km/h`
        
        overlay.style.display = 'flex'

        this.cameras.main.setBackgroundColor('#0b1020')

        // 地面を「動かない物理オブジェクト」として確実に生成
        grounds = this.physics.add.staticGroup()
        for(let i=0; i<30; i++){
            grounds.create(i*120, GROUND_Y, 'ground').setOrigin(0,0).refreshBody()
        }

        // プレイヤーの初期配置
        player = this.physics.add.sprite(150, GROUND_Y - 150, 'player_run')
        player.setDisplaySize(70, 100) 
        player.setGravityY(2500) // 重力をしっかりと強くかける

        // 当たり判定をドット絵の身体の中心に絞る調整
        player.body.setSize(120, 260)
        player.body.setOffset(68, 60)

        // ★【アニメーション定義：上段の4コマ（0〜3番）が走るモーション】
        if (!this.anims.exists('run_dash')) {
            this.anims.create({
                key: 'run_dash',
                frames: this.anims.generateFrameNumbers('player_run', { start: 0, end: 3 }),
                frameRate: 12, 
                repeat: -1     
            });
        }
        player.anims.play('run_dash', true);

        // 地面との衝突設定
        this.physics.add.collider(player, grounds, ()=>{
            if(player.body.touching.down){
                jumpCount = 0
                if(started && !gameOver && !player.anims.isPlaying) {
                    player.anims.play('run_dash', true);
                }
            }
        })

        obstacles = this.physics.add.group()
        this.physics.add.overlap(player, obstacles, ()=>{ this.dead() })

        // ★【キーボード・マウス・タッチすべてを統合したゲームコントロール】
        triggerJumpFunction = () => {
            if(gameOver) {
                triggerJumpFunction = null;
                this.scene.restart();
            } else {
                if(!started) {
                    started = true;
                    overlay.style.display = 'none';
                    player.anims.play('run_dash', true);
                }
                if(jumpCount < 2){
                    player.setVelocityY(-850); // ジャンプ速度
                    jumpCount++;
                    player.anims.stop();
                    // 下段の真ん中（7番：腕を大きく突き上げたジャンプポーズ）を指定
                    player.setFrame(7); 
                }
            }
        };

        // ブラウザのキー入力を確実にキャッチする設定
        this.input.keyboard.enabled = true;
        this.input.keyboard.off('keydown-SPACE')
        this.input.keyboard.on('keydown-SPACE', (event) => {
            event.preventDefault(); // スペースキーによるブラウザのスクロールを防止
            if(triggerJumpFunction) triggerJumpFunction();
        })

        this.obstacleTimer = this.time.addEvent({
            delay: Phaser.Math.Between(SPEED_TABLE[0].minDelay, SPEED_TABLE[0].maxDelay),
            callback: this.spawnObstacleGenerator,
            callbackScope: this,
            loop: true
        })

        this.time.addEvent({
            delay: 4500, 
            callback: this.makeHole,
            callbackScope: this,
            loop: true
        })
    }

    update(time, delta){
        if(!started || gameOver) return

        score += delta * 0.01
        scoreText.textContent = 'SCORE : ' + Math.floor(score)

        this.checkSpeedUp()

        // 穴に落ちた場合の死亡判定
        if(player.y > GROUND_Y + 120){
            this.dead()
            return
        }

        // 地面タイルをスムーズにスクロールさせる処理
        grounds.getChildren().forEach((ground)=>{
            ground.x -= speed * delta / 1000
            if(ground.x <= -120){
                let maxX = 0
                grounds.getChildren().forEach((g)=>{ if(g.x > maxX) maxX = g.x })
                ground.x = maxX + 120
            }
            ground.body.updateFromGameObject();
        })

        obstacles.getChildren().forEach((obj)=>{
            obj.x -= speed * delta / 1000
            obj.angle += 2 
            if(obj.x < -100){ obj.destroy() }
        })
    }

    checkSpeedUp() {
        const nextLevel = currentSpeedLevel + 1;
        if (SPEED_TABLE[nextLevel] && score >= SPEED_TABLE[nextLevel].threshold) {
            currentSpeedLevel = nextLevel;
            speed = SPEED_TABLE[currentSpeedLevel].speed;
            speedText.textContent = `SPEED : ${SPEED_TABLE[currentSpeedLevel].display} km/h`;
        }
    }

    spawnObstacleGenerator() {
        if(!started || gameOver) return
        const count = Phaser.Math.Between(1, 3)
        const baseOffset = this.sys.game.config.width + 100

        for(let i = 0; i < count; i++) {
            const spike = obstacles.create(baseOffset + (i * 45), GROUND_Y - 30, 'spike')
            spike.setDisplaySize(40, 40)
            spike.body.allowGravity = false
            spike.body.setImmovable(true)
            spike.body.setSize(30, 30) 
        }

        const config = SPEED_TABLE[currentSpeedLevel];
        this.obstacleTimer.delay = Phaser.Math.Between(config.minDelay, config.maxDelay);
    }

    makeHole(){
        if(!started || gameOver) return
        const screenWidth = this.sys.game.config.width
        const validGrounds = grounds.getChildren().filter(g => g.x > screenWidth + 100 && g.y === GROUND_Y)
        if(validGrounds.length < 3) return

        const randomIndex = Phaser.Math.Between(0, validGrounds.length - 3)
        const target1 = validGrounds[randomIndex]
        const target2 = validGrounds[randomIndex + 1]

        if(!target1 || !target2) return
        target1.y += 600
        target2.y += 600
    }

    dead(){
        if(gameOver) return
        gameOver = true
        player.setVelocityY(0);
        player.anims.stop();
        // 下段の右端（9番：膝をついてうなだれるゲームオーバーポーズ）を指定
        player.setFrame(9); 

        overlay.innerHTML = `
            <h1>GAME OVER</h1>
            <p>SCORE : ${Math.floor(score)}</p>
            <p>Press SPACE or Tap to Retry</p>
        `
        overlay.style.display = 'flex'
    }
}

// 画面クリック・タッチでも連動して動くように外部イベントをバインド
window.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) e.preventDefault(); 
    if(triggerJumpFunction) triggerJumpFunction();
}, { passive: false });

window.addEventListener('mousedown', () => {
    if(triggerJumpFunction) triggerJumpFunction();
});

const config = {
    type: Phaser.CANVAS, // 特定のブラウザ環境でのバグを防ぐため、CANVAS描画に強制固定
    width: WIDTH,
    height: HEIGHT,
    physics: {
        default: 'arcade',
        arcade: { gravity: {y: 0}, debug: false }
    },
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [MainScene]
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
