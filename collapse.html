<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>collapse - Clear Glass Edition</title>
    <style>
        :root {
            --bg-color: #d29a5c;
            --bubble-bg: rgba(255, 255, 255, 0.25);
            --bubble-border: rgba(255, 255, 255, 0.6);
            --text-gold: #f6e58d;
            
            /* iPhone/Safariの画面高さ(100dvh)に合わせて可変するケースサイズ */
            --case-width: 400px;
            --case-height: 72dvh; /* 画面全体の72%をゲームエリアにする */
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            color: white;
            font-family: 'Arial Rounded MT Bold', 'Helvetica Neue', sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        /* --- 上部UIレイアウト --- */
        #ui-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 15px;
            width: var(--case-width);
        }
        .bubble-box {
            background: var(--bubble-bg);
            border: 2px solid var(--bubble-border);
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 8px rgba(255,255,255,0.4), 0 4px 10px rgba(0,0,0,0.15);
            text-align: center;
        }
        .bubble-box .label {
            font-size: 11px;
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            margin-bottom: 2px;
        }
        .bubble-box .value {
            font-size: 18px;
            color: var(--text-gold);
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }
        
        #next-preview {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.5), 0 2px 4px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
        }

        /* --- ゲームエリア設定 --- */
        #game-container {
            position: relative;
            width: var(--case-width);
            height: var(--case-height);
        }

        /* ★クリアガラス（中が綺麗に見えるアクリル風）ケース */
        #glass-case {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 78%; /* 上部の雲の待機スペースを除いた高さを自動計算 */
            background: rgba(255, 255, 255, 0.08); /* 完全に透明に近く */
            border: 6px solid rgba(255, 255, 255, 0.7); /* 白い綺麗な輪郭線 */
            border-top: none; /* 上部はオープン */
            border-radius: 0 0 24px 24px;
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.2), 
                inset 0 -10px 20px rgba(255,255,255,0.1); /* 底面にわずかな光沢 */
            pointer-events: none;
            z-index: 2;
            box-sizing: border-box;
        }

        /* 追従する雲のキャラクター */
        #cloud-character {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 38px;
            background: #fffef0;
            border-radius: 20px;
            pointer-events: none;
            z-index: 3;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #cloud-character::before, #cloud-character::after {
            content: '';
            position: absolute;
            background: #fffef0;
            border-radius: 50%;
        }
        #cloud-character::before { width: 35px; height: 35px; top: -15px; left: 12px; }
        #cloud-character::after { width: 28px; height: 28px; top: -10px; right: 12px; }

        /* Matter.jsのキャンバスをコンテナと100%同期させる */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 1;
        }

        /* --- ゲームオーバー画面 --- */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(99, 64, 23, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 10;
        }
        #game-over-screen.show {
            opacity: 1;
            pointer-events: auto;
        }
        #game-over-screen h2 {
            font-size: 38px;
            color: #fff;
            margin: 0 0 10px 0;
            text-shadow: 0px 4px 8px rgba(0,0,0,0.4);
        }
        #game-over-screen p {
            font-size: 18px;
            margin: 0 0 30px 0;
            color: var(--text-gold);
            font-weight: bold;
        }
        #restart-btn {
            background: #ff7675;
            color: white;
            border: 3px solid #fff;
            padding: 10px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div class="bubble-box">
            <div class="label">スコア</div>
            <div class="value" id="score">0</div>
        </div>
        <div class="bubble-box">
            <div class="label">ネクスト</div>
            <div id="next-preview"></div>
        </div>
    </div>
    
    <div id="game-container">
        <div id="glass-case"></div>
        <div id="cloud-character"></div>

        <div id="game-over-screen">
            <h2>GAME OVER</h2>
            <p>SCORE: <span id="final-score">0</span></p>
            <button id="restart-btn">つぎへ</button>
        </div>
    </div>

<script>
const { Engine, Render, Runner, Bodies, Composite, Body, Events } = Matter;

// 要素のサイズをブラウザの表示（CSS）から動的に取得
const container = document.getElementById('game-container');
const WIDTH = container.clientWidth;
const HEIGHT = container.clientHeight;

// ガラスケースの高さの比率(78%)からデッドライン(上辺)のY座標を自動計算
const DEAD_LINE_Y = HEIGHT * (1 - 0.78); 
const CASE_BORDER = 6; // 枠線の太さ

let engine, render, runner;
let score = 0;
let currentFruit = null;
let nextFruitIndex = 0;
let isReady = false;
let isGameOver = false;
let fruitTimers = new Map();

// スマートフォン表示を考慮してフルーツのサイズをややコンパクトに調整
const FRUIT_TYPES = [
    { level: 0, radius: 12, color: '#ff3838', score: 1 },  
    { level: 1, radius: 18, color: '#ff7675', score: 2 },  
    { level: 2, radius: 24, color: '#a55eea', score: 4 },  
    { level: 3, radius: 32, color: '#ff9f43', score: 8 },  
    { level: 4, radius: 40, color: '#ffa801', score: 16 }, 
    { level: 5, radius: 50, color: '#ff4757', score: 32 }, 
    { level: 6, radius: 60, color: '#fed330', score: 64 }, 
    { level: 7, radius: 72, color: '#ff6b81', score: 128 },
    { level: 8, radius: 85, color: '#26de81', score: 256 },
    { level: 9, radius: 100, color: '#20bf6b', score: 512 },
    { level: 10, radius: 115, color: '#05c46b', score: 1024 }
];

engine = Engine.create({ gravity: { y: 1.4 } }); // 少し爽快感を出すため重力を微増

render = Render.create({
    element: container,
    engine: engine,
    options: {
        width: WIDTH,
        height: HEIGHT,
        wireframes: false,
        background: 'transparent' 
    }
});
Render.run(render);

runner = Runner.create();
Runner.run(runner, engine);

// --- ガイド線とデッドラインのカスタム描画 ---
Events.on(render, 'afterRender', () => {
    const context = render.context;

    // 1. 落下案内用点線
    if (currentFruit && currentFruit.isStatic && !isGameOver) {
        context.beginPath();
        context.setLineDash([4, 6]);
        context.moveTo(currentFruit.position.x, currentFruit.position.y);
        context.lineTo(currentFruit.position.x, HEIGHT - CASE_BORDER);
        context.lineWidth = 2;
        context.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        context.stroke();
        context.setLineDash([]);
    }

    // 2. デッドライン（ゲームオーバー警告線）
    context.beginPath();
    context.moveTo(CASE_BORDER, DEAD_LINE_Y);
    context.lineTo(WIDTH - CASE_BORDER, DEAD_LINE_Y);
    context.lineWidth = 3;
    context.strokeStyle = isGameOver ? '#ff4d4d' : 'rgba(255, 255, 255, 0.3)';
    context.stroke();
});

// --- ゲーム状態リセット ---
function initGame() {
    Composite.clear(engine.world, false);
    fruitTimers.clear();
    
    score = 0;
    document.getElementById('score').textContent = score;
    isGameOver = false;
    document.getElementById('game-over-screen').classList.remove('show');

    // ★重要：見た目の枠線（CASE_BORDER）の太さに寸分の狂いもなく物理の壁を同期させる
    const wallOptions = { isStatic: true, render: { visible: false } };
    
    const ground = Bodies.rectangle(WIDTH / 2, HEIGHT - (CASE_BORDER / 2), WIDTH, CASE_BORDER, wallOptions);
    const leftWall = Bodies.rectangle(CASE_BORDER / 2, HEIGHT / 2, CASE_BORDER, HEIGHT, wallOptions);
    const rightWall = Bodies.rectangle(WIDTH - (CASE_BORDER / 2), HEIGHT / 2, CASE_BORDER, HEIGHT, wallOptions);
    
    Composite.add(engine.world, [ground, leftWall, rightWall]);

    nextFruitIndex = Math.floor(Math.random() * 4); 
    updateNextDisplay();
    
    isReady = true;
    spawnNextFruit();
}

function updateNextDisplay() {
    const preview = document.getElementById('next-preview');
    preview.style.backgroundColor = FRUIT_TYPES[nextFruitIndex].color;
}

function createFruit(x, y, typeIndex, isStatic = false) {
    const type = FRUIT_TYPES[typeIndex];
    return Bodies.circle(x, y, type.radius, {
        isStatic: isStatic,
        restitution: 0.12, 
        friction: 0.08,
        render: { fillStyle: type.color },
        plugin: { level: type.level, combined: false }
    });
}

function spawnNextFruit() {
    if (!isReady || isGameOver) return;
    
    currentFruit = createFruit(WIDTH / 2, DEAD_LINE_Y - 30, nextFruitIndex, true);
    Composite.add(engine.world, currentFruit);
    
    nextFruitIndex = Math.floor(Math.random() * 5);
    updateNextDisplay();
}

// --- 操作・追従処理 ---
function handleMove(clientX) {
    if (!currentFruit || !currentFruit.isStatic || isGameOver) return;
    
    const rect = render.canvas.getBoundingClientRect();
    let mouseX = clientX - rect.left;
    
    // クリアガラスケースの内側の境界線からフルーツがはみ出さないようにガード
    const radius = FRUIT_TYPES[currentFruit.plugin.level].radius;
    const minX = CASE_BORDER + radius;
    const maxX = WIDTH - CASE_BORDER - radius;
    
    if (mouseX < minX) mouseX = minX;
    if (mouseX > maxX) mouseX = maxX;
    
    Body.setPosition(currentFruit, { x: mouseX, y: currentFruit.position.y });

    const cloud = document.getElementById('cloud-character');
    cloud.style.left = `${mouseX}px`;
}

function handleDrop() {
    if (!currentFruit || !isReady || isGameOver) return;
    
    isReady = false;
    Body.setStatic(currentFruit, false);
    currentFruit = null;
    
    setTimeout(() => {
        if (!isGameOver) {
            isReady = true;
            spawnNextFruit();
        }
    }, 500);
}

// イベントをコンテナ単位で補足
container.addEventListener('mousemove', (e) => handleMove(e.clientX));
container.addEventListener('click', handleDrop);

container.addEventListener('touchmove', (e) => {
    if(e.touches.length > 0) handleMove(e.touches[0].clientX);
});
container.addEventListener('touchend', handleDrop);

// --- 合体ロジック ---
Events.on(engine, 'collisionStart', (event) => {
    event.pairs.forEach((pair) => {
        const bodyA = pair.bodyA;
        const bodyB = pair.bodyB;
        
        if (bodyA.plugin && bodyB.plugin && bodyA.plugin.level === bodyB.plugin.level) {
            const currentLevel = bodyA.plugin.level;
            if (bodyA.plugin.combined || bodyB.plugin.combined) return;
            if (currentLevel >= FRUIT_TYPES.length - 1) return; 
            
            bodyA.plugin.combined = true;
            bodyB.plugin.combined = true;
            
            const newX = (bodyA.position.x + bodyB.position.x) / 2;
            const newY = (bodyA.position.y + bodyB.position.y) / 2;
            
            score += FRUIT_TYPES[currentLevel].score;
            document.getElementById('score').textContent = score;
            
            fruitTimers.delete(bodyA.id);
            fruitTimers.delete(bodyB.id);
            
            Composite.remove(engine.world, [bodyA, bodyB]);
            
            const upgradedFruit = createFruit(newX, newY, currentLevel + 1);
            Composite.add(engine.world, upgradedFruit);
        }
    });
});

// --- ゲームオーバー監視 ---
Events.on(engine, 'afterUpdate', () => {
    if (isGameOver) return;

    const allBodies = Composite.allBodies(engine.world);
    const now = Date.now();

    allBodies.forEach((body) => {
        if (body.isStatic || body === currentFruit) return;

        const fruitTopY = body.position.y - (body.circleRadius || 0);
        
        if (fruitTopY < DEAD_LINE_Y) {
            if (!fruitTimers.has(body.id)) {
                fruitTimers.set(body.id, now);
            } else {
                if (now - fruitTimers.get(body.id) > 1500) {
                    triggerGameOver();
                }
            }
        } else {
            fruitTimers.delete(body.id);
        }
    });
});

function triggerGameOver() {
    isGameOver = true;
    isReady = false;
    document.getElementById('final-score').textContent = score;
    document.getElementById('game-over-screen').classList.add('show');
    if (currentFruit) {
        Composite.remove(engine.world, currentFruit);
        currentFruit = null;
    }
}

document.getElementById('restart-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    initGame();
});

initGame();
</script>

</body>
</html>
