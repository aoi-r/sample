<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess Crusade</title>
<style>
    * { 
        box-sizing: border-box; 
        touch-action: manipulation; 
        -webkit-user-select: none;
        user-select: none;
    }
    body { 
        background: #2c3e50; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center;
        min-height: 100vh;
        margin: 0; 
        padding: 15px; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    #watcherConsole { 
        display: none; 
        background: #34495e; 
        color: white; 
        padding: 10px 20px; 
        border-radius: 8px; 
        font-weight: bold; 
        margin-bottom: 12px; 
        align-items: center; 
        gap: 15px; 
        font-size: 14px; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 480px;
        justify-content: space-between;
    }
    #joinBtn { background: #27ae60; color: white; border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    #joinBtn:hover { background: #2ecc71; }
    
    #resetBtn { 
        width: 100%;
        max-width: 480px;
        padding: 12px; 
        margin-bottom: 12px; 
        border: none; 
        border-radius: 8px; 
        font-weight: bold; 
        font-size: 16px;
        cursor: pointer; 
        transition: 0.3s; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .normal { background: #ecf0f1; color: #2c3e50; }
    .waiting { background: #e74c3c; color: white; opacity: 0.8; }
    
    #cardArea {
        width: 100%;
        max-width: 480px;
        margin-bottom: 15px;
        background: #34495e;
        padding: 12px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .card-buttons {
        display: flex;
        gap: 10px;
        justify-content: space-between;
    }
    .card-buttons button {
        flex: 1;
        background: #2c3e50;
        border: 2px solid #ecf0f1;
        border-radius: 6px;
        padding: 6px;
        color: white;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: 0.2s;
    }
    .card-buttons button img {
        width: 100%;
        max-width: 45px;
        aspect-ratio: 1;
        object-fit: contain;
        margin-bottom: 4px;
    }
    .card-buttons button span {
        font-size: 11px;
        font-weight: bold;
    }
    
    .canvas-container {
        width: 100%;
        max-width: 480px;
        aspect-ratio: 1 / 1;
        position: relative;
    }
    canvas { 
        background: #f0d9b5; 
        border: 4px solid #34495e; 
        border-radius: 4px;
        width: 100%; 
        height: 100%; 
        touch-action: none; 
        cursor: pointer; 
        box-shadow: 0 8px 16px rgba(0,0,0,0.4); 
    }
    
    #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; font-size: 28px; font-weight: bold; z-index: 10; cursor: pointer; }
    #overlay span { font-size: 16px; color: #ccc; margin-top: 10px; }

    #promotionOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; font-size: 20px; font-weight: bold; z-index: 20; }
    .promo-buttons { display: flex; gap: 15px; margin-top: 20px; }
    .promo-buttons button { background: #34495e; border: 2px solid #ecf0f1; border-radius: 8px; padding: 10px; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; width: 85px; font-weight: bold; transition: 0.2s; }
    .promo-buttons button:hover { background: #2ecc71; border-color: #fff; }
    .promo-buttons button img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; }

    #cardModal {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85); display: none; flex-direction: column;
        justify-content: center; align-items: center; z-index: 30; padding: 20px;
    }
    #modalCardImg {
        max-width: 340px; width: 85vw; height: auto; border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 20px;
    }
    .modal-buttons { display: flex; gap: 20px; width: 100%; max-width: 340px; }
    .modal-buttons button {
        flex: 1; padding: 12px; border: none; border-radius: 8px;
        font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    #cardUseBtn { background: #27ae60; color: white; }
    #cardUseBtn:hover { background: #2ecc71; }
    #cardCancelBtn { background: #7f8c8d; color: white; }
    #cardCancelBtn:hover { background: #95a5a6; }

    #effectOverlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6); display: none; flex-direction: column;
        justify-content: center; align-items: center; z-index: 40; pointer-events: none;
    }
    .effect-card-wrapper {
        position: relative; display: flex; flex-direction: column; align-items: center;
        animation: cardCast 2.5s ease-in-out forwards;
    }
    #effectCardImg {
        max-width: 320px; width: 80vw; height: auto; border-radius: 12px;
        box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
    }
    @keyframes cardCast {
        0% { transform: scale(0.3) rotate(-10deg); opacity: 0; filter: brightness(2); }
        15% { transform: scale(1.05) rotate(0deg); opacity: 1; filter: brightness(1.2); }
        25% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 50px rgba(255, 215, 0, 0.8); }
        75% { transform: scale(1); opacity: 1; filter: blur(0px); }
        100% { transform: scale(1.3) translateY(-50px); opacity: 0; filter: blur(10px) brightness(2); }
    }
</style>
</head>
<body>
<div id="watcherConsole">
  <span id="watcherStatus">観戦モード中</span>
  <button id="joinBtn">参戦する</button>
</div>

<button id="resetBtn" class="normal">リセット申請</button>

<div id="cardArea" style="display: none;">
  <div style="color: white; font-size: 13px; margin-bottom: 8px; font-weight: bold; text-align: center;" id="cardTitle">作戦カード（残り各1回）</div>
  <div class="card-buttons">
    <button id="card1Btn">
      <img src="img/1.png" alt="2連続行動">
      <span>2連続行動</span>
    </button>
    <button id="card2Btn">
      <img src="img/2.png" alt="絶対防御">
      <span>絶対防御</span>
    </button>
    <button id="card3Btn">
      <img src="img/3.png" alt="ポーン洗脳">
      <span>ポーン洗脳</span>
    </button>
  </div>
</div>

<div class="canvas-container" id="canvasContainer">
    <canvas id="game"></canvas>
</div>

<div id="overlay" onclick="closeOverlay()">
  <div id="winnerText"></div>
  <span>画面をタップして新しくゲームを始める</span>
</div>

<div id="promotionOverlay">
  <div>昇格させる駒を選んでください</div>
  <div id="promo-buttons" class="promo-buttons"></div>
</div>

<div id="cardModal">
  <img id="modalCardImg" src="" alt="Card Preview">
  <div class="modal-buttons">
    <button id="cardCancelBtn">戻る</button>
    <button id="cardUseBtn">使用する</button>
  </div>
</div>

<div id="effectOverlay">
  <div class="effect-card-wrapper">
    <img id="effectCardImg" src="" alt="Effect Card">
    <div id="effectText" style="color: #fff; font-size: 24px; font-weight: bold; margin-top: 15px; text-shadow: 0 0 10px #000, 0 0 20px gold;"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, update, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const db = getDatabase(initializeApp({
  apiKey: "AIzaSyDk7KNFdlp9zPtnixdNv96VtfKrELX1f8I",
  databaseURL: "https://syogi-cee67-default-rtdb.firebaseio.com",
  projectId: "syogi-cee67"
}));

let myId = null;
try {
  myId = sessionStorage.getItem("chess_myId");
  if (!myId) {
    myId = Math.random().toString(36).slice(2);
    sessionStorage.setItem("chess_myId", myId);
  }
} catch (e) {
  myId = Math.random().toString(36).slice(2);
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const container = document.getElementById("canvasContainer");

let CELL = 60;

function resizeCanvas() {
  const size = container.clientWidth;
  canvas.width = size;
  canvas.height = size;
  CELL = size / 8;
  
  if (state && state.pieces) {
    const isWhiteOnline = state.whiteId ? (presence[state.whiteId] === true) : false;
    const isBlackOnline = state.blackId ? (presence[state.blackId] === true) : false;
    draw(isWhiteOnline, isBlackOnline);
  }
}

window.addEventListener("resize", resizeCanvas);

let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = (new Date()).getTime();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, { passive: false });

// 【新規】駒画像のファイル名マッピングとプリロード処理
const pieceImages = {};
const pieceFileNames = {
  white: { pawn: "白ぽーん.png", rook: "白るーく", knight: "白ないと.png", bishop: "白びしょっぷ.png", queen: "白くいーん.png", king: "白きんぐ.png" },
  black: { pawn: "黒ぽーん.png", rook: "黒るーく.png", knight: "黒ないと.png", bishop: "黒びしょっぷ.png", queen: "黒くいーん.png", king: "黒きんぐ.png" }
};

// 画像オブジェクトを生成して一挙にロード
for (const color in pieceFileNames) {
  pieceImages[color] = {};
  for (const type in pieceFileNames[color]) {
    const img = new Image();
    // 拡張子 .png が最初から付いているものと付いていないもの（白るーく等）のブレを吸収
    let filename = pieceFileNames[color][type];
    if (!filename.endsWith(".png")) {
      filename += ".png";
    }
    img.src = `img/${filename}`;
    pieceImages[color][type] = img;
    // 画像ロード完了時に盤面を再描画
    img.onload = () => {
      if (state && state.pieces) {
        const isWhiteOnline = state.whiteId ? (presence[state.whiteId] === true) : false;
        const isBlackOnline = state.blackId ? (presence[state.blackId] === true) : false;
        draw(isWhiteOnline, isBlackOnline);
      }
    };
  }
}

// 画像の読み込みに失敗した場合や未用意の駒のための従来の文字フォールバック
const uPieces = {
    white: { pawn: "♙", rook: "♖", knight: "♘", bishop: "♗", queen: "♕", king: "♔" },
    black: { pawn: "♟", rook: "♜", knight: "♞", bishop: "♝", queen: "♛", king: "♚" }
};

let state = { 
  pieces: {}, 
  turn: "white", 
  resetReq: false, 
  resetSender: null, 
  winner: null, 
  whiteId: null, 
  blackId: null, 
  lastMove: null,
  cards: {
    white: { card1: { used: false }, card2: { used: false }, card3: { used: false } },
    black: { card1: { used: false }, card2: { used: false }, card3: { used: false } }
  },
  invincibleTurn: null,
  doubleTurnReserved: false,
  brainwashedPawnKey: null,
  activeEffect: null,
  cardUsedThisTurn: false
};
let presence = {}; 
let selected = { type: null, key: null };
let lastResetReq = false;
let myRole = null;
let currentLocalEffectId = null;

function isBlocked(p, tx, ty) {
  const dx = tx - p.x, dy = ty - p.y;
  const sx = dx === 0 ? 0 : Math.sign(dx);
  const sy = dy === 0 ? 0 : Math.sign(dy);
  let cx = p.x + sx, cy = p.y + sy;
  while (cx !== tx || cy !== ty) {
    if (Object.values(state.pieces || {}).some(piece => piece.x === cx && piece.y === cy)) return true;
    cx += sx; cy += sy;
  }
  return false;
}

function canMove(p, tx, ty) {
  if (tx < 0 || tx > 7 || ty < 0 || ty > 7) return false;
  const dx = tx - p.x, dy = ty - p.y;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  const target = Object.values(state.pieces || {}).find(piece => piece.x === tx && piece.y === ty);
  if (target && target.owner === p.owner) return false;

  if (target && state.invincibleTurn && state.invincibleTurn === target.owner && target.type !== "king") {
    return false;
  }

  switch(p.type) {
    case "pawn":
      const startRow = p.owner === "white" ? 6 : 1;
      const fwd = p.owner === "white" ? -1 : 1;
      if (dx === 0 && dy === fwd && !target) return true;
      if (dx === 0 && dy === fwd * 2 && p.y === startRow && !target && !isBlocked(p, tx, ty)) return true;
      if (absDx === 1 && dy === fwd && target && target.owner !== p.owner) return true;
      return false;
    case "rook":
      return (dx === 0 || dy === 0) && (dx !== 0 || dy !== 0) && !isBlocked(p, tx, ty);
    case "knight":
      return (absDx === 1 && absDy === 2) || (absDx === 2 && absDy === 1);
    case "bishop":
      return absDx === absDy && dx !== 0 && !isBlocked(p, tx, ty);
    case "queen":
      return ((dx === 0 || dy === 0) || (absDx === absDy)) && (dx !== 0 || dy !== 0) && !isBlocked(p, tx, ty);
    case "king":
      return absDx <= 1 && absDy <= 1 && (dx !== 0 || dy !== 0);
    default: return false;
  }
}

canvas.addEventListener("pointerdown", e => {
  if (state.winner) return;
  
  if (myRole) {
    const opponentId = myRole === "white" ? state.blackId : state.whiteId;
    if (!opponentId) return; 
  }

  if (!myRole || state.turn !== myRole) return;

  const rect = canvas.getBoundingClientRect();
  let rectX = (e.clientX - rect.left) * (canvas.width / rect.width);
  let rectY = (e.clientY - rect.top) * (canvas.height / rect.height);

  if (myRole === "black") { 
    rectX = canvas.width - rectX; 
    rectY = canvas.height - rectY; 
  }

  const x = Math.floor(rectX / CELL);
  const y = Math.floor(rectY / CELL);

  const isWhiteOnline = state.whiteId ? (presence[state.whiteId] === true) : false;
  const isBlackOnline = state.blackId ? (presence[state.blackId] === true) : false;

  if (selected.type === 'card3_select') {
    const targetKey = Object.keys(state.pieces || {}).find(k => state.pieces[k].x === x && state.pieces[k].y === y);
    const p = targetKey ? state.pieces[targetKey] : null;
    const opponentRole = myRole === "white" ? "black" : "white";

    if (p && p.type === "pawn" && p.owner === opponentRole) {
      p.owner = myRole;
      state.cards[myRole].card3.used = true;
      state.brainwashedPawnKey = targetKey; 
      state.cardUsedThisTurn = true;
      
      state.activeEffect = {
        id: Math.random().toString(36).slice(2),
        cardKey: "card3",
        user: myRole
      };

      selected = { type: null };
      set(ref(db, "chess_game"), state);
      return;
    } else {
      alert("相手のポーンを選択してください。");
      return;
    }
  }

  const pKey = Object.keys(state.pieces || {}).find(k => state.pieces[k].x === x && state.pieces[k].y === y && state.pieces[k].owner === state.turn);

  if (pKey && state.brainwashedPawnKey === pKey) {
    alert("洗脳されたばかりのポーンは、次の自分のターンまで動かせません。");
    return;
  }

  if (pKey) { selected = {type: 'board', key: pKey}; draw(isWhiteOnline, isBlackOnline); return; }

  if (selected.type === 'board') {
    const p = state.pieces[selected.key];
    if (!canMove(p, x, y) || x < 0 || x > 7 || y < 0 || y > 7) { selected = { type: null }; draw(isWhiteOnline, isBlackOnline); return; }
    
    const targetKey = Object.keys(state.pieces || {}).find(k => state.pieces[k].x === x && state.pieces[k].y === y);
    const isPromotion = p.type === "pawn" && ((p.owner === "white" && y === 0) || (p.owner === "black" && y === 7));

    const finalizeMove = (promoPieceType = null) => {
      if (targetKey && state.pieces[targetKey].owner !== p.owner) {
        const captured = state.pieces[targetKey];
        if (captured.type === "king") state.winner = state.turn;
        delete state.pieces[targetKey];
      }

      state.lastMove = { fromX: p.x, fromY: p.y, toX: x, toY: y };
      p.x = x; p.y = y;

      if (promoPieceType) {
        p.type = promoPieceType;
      }

      if (state.brainwashedPawnKey) {
        state.brainwashedPawnKey = null; 
      }

      state.cardUsedThisTurn = false; 

      if (state.doubleTurnReserved) {
        state.doubleTurnReserved = false; 
      } else {
        state.turn = state.turn === "white" ? "black" : "white";
      }

      if (state.invincibleTurn === state.turn) {
        state.invincibleTurn = null;
      }
      
      selected = {type: null};
      set(ref(db, "chess_game"), state);
      document.getElementById('promotionOverlay').style.display = 'none';
    };

    if (isPromotion) {
      const promoButtonsContainer = document.getElementById('promo-buttons');
      promoButtonsContainer.innerHTML = '';
      
      const options = [
          { type: 'queen', label: 'Queen' },
          { type: 'rook', label: 'Rook' },
          { type: 'bishop', label: 'Bishop' },
          { type: 'knight', label: 'Knight' }
      ];

      options.forEach(opt => {
          const btn = document.createElement('button');
          const isWhite = p.owner === 'white';
          
          // 【修正】昇格ポップアップ内もテキストではなく画像を表示
          const imgObj = pieceImages[p.owner][opt.type];
          if (imgObj && imgObj.complete && imgObj.naturalWidth !== 0) {
              btn.innerHTML = `
                  <img src="${imgObj.src}" alt="${opt.label}">
                  <div>${opt.label}</div>
              `;
          } else {
              // 画像の読み込みが間に合わなかった場合のバックアップ
              const char = uPieces[p.owner][opt.type];
              btn.innerHTML = `
                  <div style="font-size: 35px; color: ${isWhite ? '#ffffff' : '#000000'}; text-shadow: ${isWhite ? '-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000' : 'none'}; line-height: 1.2;">
                      ${char}
                  </div>
                  <div>${opt.label}</div>
              `;
          }
          btn.onclick = () => finalizeMove(opt.type);
          promoButtonsContainer.appendChild(btn);
      });

      document.getElementById('promotionOverlay').style.display = 'flex';
      return; 
    }

    finalizeMove();
  }
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (state.resetReq) return;
  state.resetReq = true; state.resetSender = myId; set(ref(db, "chess_game"), state);
});

window.closeOverlay = () => { document.getElementById('overlay').style.display = 'none'; initBoard(true); };

function initBoard(keepPlayers = false) {
  const p = {}; 
  const backRank = ["rook", "knight", "bishop", "queen", "king", "bishop", "knight", "rook"];
  
  backRank.forEach((t, i) => { p["b_"+i] = {x:i, y:0, type:t, owner:"black"}; });
  for(let i=0; i<8; i++) { p["bp_"+i] = {x:i, y:1, type:"pawn", owner:"black"}; }
  
  backRank.forEach((t, i) => { p["w_"+i] = {x:i, y:7, type:t, owner:"white"}; });
  for(let i=0; i<8; i++) { p["wp_"+i] = {x:i, y:6, type:"pawn", owner:"white"}; }
  
  const newState = { 
    pieces: p, 
    turn: "white", 
    resetReq: false, 
    resetSender: null, 
    winner: null, 
    whiteId: keepPlayers ? (state.whiteId || null) : null, 
    blackId: keepPlayers ? (state.blackId || null) : null, 
    lastMove: null,
    cards: {
      white: { card1: { used: false }, card2: { used: false }, card3: { used: false } },
      black: { card1: { used: false }, card2: { used: false }, card3: { used: false } }
    },
    invincibleTurn: null,
    doubleTurnReserved: false,
    brainwashedPawnKey: null,
    activeEffect: null,
    cardUsedThisTurn: false
  };
  currentLocalEffectId = null;
  set(ref(db, "chess_game"), newState);
}

function draw(isWhiteOnline, isBlackOnline) {
  const size = canvas.width;
  ctx.clearRect(0, 0, size, size);
  ctx.save();
  
  if (myRole === "black") { ctx.translate(size / 2, size / 2); ctx.rotate(Math.PI); ctx.translate(-size / 2, -size / 2); }
  
  for (let i = 0; i < 8; i++) {
    for (let j = 0; j < 8; j++) {
      ctx.fillStyle = (i + j) % 2 === 0 ? "#f0d9b5" : "#b58863";
      ctx.fillRect(i * CELL, j * CELL, CELL, CELL);

      if (state.lastMove && ((state.lastMove.toX === i && state.lastMove.toY === j) || (state.lastMove.fromX === i && state.lastMove.fromY === j))) {
        ctx.fillStyle = "rgba(255, 255, 0, 0.4)"; 
        ctx.fillRect(i * CELL, j * CELL, CELL, CELL);
      }
    }
  }

  if (selected.type === 'board' && state.pieces[selected.key]) {
    const activePiece = state.pieces[selected.key];
    for (let i = 0; i < 8; i++) {
      for (let j = 0; j < 8; j++) {
        if (canMove(activePiece, i, j)) {
          ctx.fillStyle = "rgba(46, 204, 113, 0.45)"; 
          ctx.fillRect(i * CELL, j * CELL, CELL, CELL);
          
          ctx.beginPath();
          ctx.arc(i * CELL + CELL / 2, j * CELL + CELL / 2, CELL * 0.12, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(39, 174, 96, 0.6)";
          ctx.fill();
        }
      }
    }
  }

  for (const k in (state.pieces || {})) {
    const p = state.pieces[k]; 
    ctx.save();
    
    if (selected.key === k && selected.type === 'board') {
      ctx.shadowColor = "rgba(0, 0, 0, 0.5)"; ctx.shadowBlur = 10;
    }
    
    ctx.translate(p.x * CELL + CELL/2, p.y * CELL + CELL/2);
    if (p.owner === "black") ctx.rotate(Math.PI);
    
    // 【修正】従来のテキスト描画から画像描画処理へ変更
    const imgObj = pieceImages[p.owner][p.type];
    
    // 画像が正常にロードできている場合は画像を描画
    if (imgObj && imgObj.complete && imgObj.naturalWidth !== 0) {
      const imgSize = CELL * 0.85; // マス目に合わせて少し余白を持たせる
      ctx.drawImage(imgObj, -imgSize / 2, -imgSize / 2, imgSize, imgSize);
    } else {
      // 万が一画像がない、あるいはロードエラーの際はフォールバックとして従来の文字を出す
      const fontSize = Math.floor(CELL * 0.73);
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const char = uPieces[p.owner][p.type];
      if (p.owner === "white") {
          ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#000000"; ctx.lineWidth = size * 0.003;
          ctx.strokeText(char, 0, 2); ctx.fillText(char, 0, 2);
      } else {
          ctx.fillStyle = "#000000"; ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = size * 0.0016;
          ctx.strokeText(char, 0, 2); ctx.fillText(char, 0, 2);
      }
    }

    if (selected.key === k && selected.type === 'board') { 
        ctx.strokeStyle = "#e74c3c"; 
        ctx.lineWidth = Math.max(2, size * 0.006); 
        ctx.strokeRect(-CELL/2 + 2, -CELL/2 + 2, CELL - 4, CELL - 4); 
    }
    ctx.restore();
  }
  
  ctx.restore();

  const btn = document.getElementById("resetBtn");
  if (state.resetReq) {
    if (state.resetSender === myId) { btn.innerText = "リセット回答待ち..."; btn.className = "waiting"; btn.disabled = true; }
    else { btn.innerText = "リセット申請を受信中"; btn.className = "waiting"; btn.disabled = false; }
  } else { btn.innerText = "リセット申請"; btn.className = "normal"; btn.disabled = false; }

  let opponentMissing = false;
  let opponentOffline = false;
  let opponentName = myRole === "white" ? "黒（Black）" : "白（White）";

  if (myRole === "white") {
    if (!state.blackId) opponentMissing = true;
    else if (!isBlackOnline) opponentOffline = true;
  } else if (myRole === "black") {
    if (!state.whiteId) opponentMissing = true;
    else if (!isWhiteOnline) opponentOffline = true;
  }

  if ((opponentMissing || opponentOffline) && !state.winner && myRole) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = opponentMissing ? "#2980b9" : "#c0392b"; 
    ctx.fillRect(size * 0.1, size * 0.4, size * 0.8, size * 0.2);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(size * 0.1, size * 0.4, size * 0.8, size * 0.2);
    ctx.fillStyle = "#fff"; ctx.font = `bold ${Math.floor(size * 0.037)}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    
    if (opponentMissing) {
      ctx.fillText("対戦相手を待っています...", size / 2, size / 2);
    } else {
      ctx.fillText(`${opponentName}が切断されました`, size / 2, size * 0.47);
      ctx.font = `${Math.floor(size * 0.029)}px sans-serif`; ctx.fillText("復帰、または新規参戦を待っています...", size / 2, size * 0.53);
    }
  }

  if (myRole && state.turn !== myRole && !state.winner && !opponentMissing && !opponentOffline && selected.type !== 'card3_select') {
    ctx.fillStyle = "rgba(0, 0, 0, 0.1)"; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "rgba(44, 62, 80, 0.9)"; ctx.fillRect(size * 0.27, size * 0.45, size * 0.46, size * 0.1);
    ctx.strokeStyle = "#ecf0f1"; ctx.lineWidth = 2; ctx.strokeRect(size * 0.27, size * 0.45, size * 0.46, size * 0.1);
    ctx.fillStyle = "#fff"; ctx.font = `bold ${Math.floor(size * 0.033)}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("相手のターンです", size / 2, size / 2);
  }

  const overlayEl = document.getElementById('overlay');
  const winnerTxtEl = document.getElementById("winnerText");
  if (state.winner) {
    winnerTxtEl.innerText = (state.winner === "white" ? "白(White)" : "黒(Black)") + "の勝ち！";
    overlayEl.style.display = 'flex';
  } else { 
    overlayEl.style.display = 'none'; 
  }
}

function triggerCardEffectAnimation(cardKey, userName) {
  const overlay = document.getElementById("effectOverlay");
  const img = document.getElementById("effectCardImg");
  const txt = document.getElementById("effectText");
  
  let num = cardKey.replace("card", "");
  img.src = `img/${num}.png`;
  
  const sideName = userName === "white" ? "白のプレイヤー" : "黒のプレイヤー";
  let cardTitle = "";
  if (cardKey === "card1") cardTitle = "【神速の進撃】";
  if (cardKey === "card2") cardTitle = "【聖騎士の防壁】";
  if (cardKey === "card3") cardTitle = "【忠誠の反転】";
  
  txt.innerText = `${sideName}が ${cardTitle} を発動！`;
  
  overlay.style.display = "flex";
  const wrapper = overlay.querySelector('.effect-card-wrapper');
  wrapper.style.animation = 'none';
  wrapper.offsetHeight;
  wrapper.style.animation = 'cardCast 2.5s ease-in-out forwards';
  
  setTimeout(() => {
    overlay.style.display = "none";
  }, 2500);
}

function updateGameSystem() {
  if (!state || !state.pieces) return;

  const isWhiteOnline = state.whiteId ? (presence[state.whiteId] === true) : false;
  const isBlackOnline = state.blackId ? (presence[state.blackId] === true) : false;

  if (state.whiteId === myId) {
    myRole = "white";
  } else if (state.blackId === myId) {
    myRole = "black";
  } else {
    myRole = null;
  }

  if (state.activeEffect && state.activeEffect.id !== currentLocalEffectId) {
    currentLocalEffectId = state.activeEffect.id;
    triggerCardEffectAnimation(state.activeEffect.cardKey, state.activeEffect.user);
  }

  const cardArea = document.getElementById("cardArea");
  if (myRole && !state.winner) {
    cardArea.style.display = "block";
    
    if (!state.cards) {
      state.cards = {
        white: { card1: { used: false }, card2: { used: false }, card3: { used: false } },
        black: { card1: { used: false }, card2: { used: false }, card3: { used: false } }
      };
    }
    
    const myCards = state.cards[myRole];
    const isMyTurn = state.turn === myRole;
    const opponentId = myRole === "white" ? state.blackId : state.whiteId;
    
    const canUseCard = isMyTurn && opponentId && !state.cardUsedThisTurn; 

    ["card1", "card2", "card3"].forEach((cKey) => {
      const btn = document.getElementById(`${cKey}Btn`);
      const isUsed = myCards && myCards[cKey] ? myCards[cKey].used : false;

      btn.onclick = null;

      if (isUsed) {
        btn.disabled = true;
        btn.style.opacity = "0.2";
        btn.style.borderColor = "#7f8c8d";
        btn.style.background = "#1a252f";
      } else if (!canUseCard && selected.type !== 'card3_select') {
        btn.disabled = true;
        btn.style.opacity = "0.5";
        btn.style.borderColor = "#ecf0f1";
        btn.style.background = "#2c3e50";
      } else {
        btn.disabled = false;
        btn.style.opacity = "1";
        btn.style.borderColor = "#27ae60";
        btn.style.background = "#2c3e50";
        
        btn.onclick = () => {
          if (state.turn !== myRole || state.cardUsedThisTurn) return;
          
          const modal = document.getElementById("cardModal");
          const modalImg = document.getElementById("modalCardImg");
          const useBtn = document.getElementById("cardUseBtn");
          const cancelBtn = document.getElementById("cardCancelBtn");
          
          let num = cKey.replace("card", "");
          modalImg.src = `img/${num}.png`;
          modal.style.display = "flex";
          
          cancelBtn.onclick = () => { modal.style.display = "none"; };
          
          useBtn.onclick = () => {
            modal.style.display = "none";
            if (state.turn !== myRole || state.cardUsedThisTurn) return;

            if (cKey === "card1") {
              state.cards[myRole].card1.used = true;
              state.doubleTurnReserved = true; 
              state.cardUsedThisTurn = true; 
              state.activeEffect = {
                id: Math.random().toString(36).slice(2),
                cardKey: "card1",
                user: myRole
              };
              set(ref(db, "chess_game"), state);
            } 
            else if (cKey === "card2") {
              state.cards[myRole].card2.used = true;
              state.invincibleTurn = myRole; 
              state.cardUsedThisTurn = true; 
              state.activeEffect = {
                id: Math.random().toString(36).slice(2),
                cardKey: "card2",
                user: myRole
              };
              set(ref(db, "chess_game"), state);
            } 
            else if (cKey === "card3") {
              selected = { type: 'card3_select' };
              draw(isWhiteOnline, isBlackOnline);
              updateGameSystem(); 
            }
          };
        };
      }
    });
    
    const cardTitle = document.getElementById("cardTitle");
    if (selected.type === 'card3_select') {
      cardTitle.innerText = "🔮 洗脳する相手のポーンをタップしてください";
      cardTitle.style.color = "#e74c3c";
      const btn3 = document.getElementById("card3Btn");
      btn3.disabled = false;
      btn3.style.borderColor = "#e74c3c";
      btn3.onclick = () => { 
        selected = { type: null }; 
        draw(isWhiteOnline, isBlackOnline); 
        updateGameSystem();
      };
    } else if (state.cardUsedThisTurn) {
      cardTitle.innerText = "🔒 このターンはすでに作戦を実行しました";
      cardTitle.style.color = "#e67e22";
    } else {
      cardTitle.innerText = "作戦カード（残り各1回）";
      cardTitle.style.color = "white";
    }

  } else {
    cardArea.style.display = "none";
  }

  const watcherConsole = document.getElementById("watcherConsole");
  const watcherStatus = document.getElementById("watcherStatus");
  const joinBtn = document.getElementById("joinBtn");

  if (!myRole) {
    watcherConsole.style.display = "flex";
    watcherStatus.innerText = `👀 観戦 (${state.turn === "white" ? "白" : "黒"}の手番)`;
    
    let emptyRole = null;
    if (!state.whiteId || !isWhiteOnline) emptyRole = "white";
    else if (!state.blackId || !isBlackOnline) emptyRole = "black";
    
    if (emptyRole && !state.winner) {
      joinBtn.style.display = "inline-block";
      joinBtn.innerText = `⚔️ ${emptyRole === "white" ? "白" : "黒"}で参戦`;
      
      joinBtn.onclick = () => {
        const hasZombie = state[emptyRole + "Id"] && !presence[state[emptyRole + "Id"]];
        const msg = hasZombie 
          ? `前のプレイヤーがオフラインです。席を引き継いで参戦しますか？`
          : `${emptyRole === "white" ? "白" : "黒"}の席が空いています。参戦しますか？`;

        if (confirm(msg)) {
          if (emptyRole === "white") update(ref(db), { "chess_game/whiteId": myId });
          else update(ref(db), { "chess_game/blackId": myId });
        }
      };
    } else { 
      joinBtn.style.display = "none"; 
    }
  } else {
    watcherConsole.style.display = "none";
  }
  
  draw(isWhiteOnline, isBlackOnline); 
  
  if (state.resetReq && !lastResetReq && state.resetSender !== myId) {
    lastResetReq = true;
    setTimeout(() => {
      if (confirm("相手からリセット申請が届きました。承諾して盤面を初期化しますか？")) { initBoard(true); }
      else { update(ref(db), { "chess_game/resetReq": false, "chess_game/resetSender": null }); }
    }, 100);
  } else { lastResetReq = state.resetReq; }
}

onValue(ref(db, ".info/connected"), snap => {
  if (snap.val() === true) {
    onDisconnect(ref(db, `chess_presence/${myId}`)).remove();
    set(ref(db, `chess_presence/${myId}`), true);
  }
});

onValue(ref(db, "chess_presence"), snap => {
  presence = snap.val() || {};
  updateGameSystem();
});

onValue(ref(db, "chess_game"), snap => { 
  if(snap.val()) { 
    state = snap.val(); 
    resizeCanvas();
    updateGameSystem();
  } else { 
    initBoard(false); 
  }
});
</script>
</body>
</html>
