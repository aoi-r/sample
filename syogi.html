<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リアルタイム将棋</title>
<style>
    body { background: #f4e4bc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    canvas { background: #f9d784; border: 2px solid #5d4037; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game" width="540" height="540"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// Firebase設定
const firebaseConfig = {
  apiKey: "AIzaSyDk7KNFdlp9zPtnixdNv96VtfKrELX1f8I",
  databaseURL: "https://syogi-cee67-default-rtdb.firebaseio.com",
  projectId: "syogi-cee67"
};
const db = getDatabase(initializeApp(firebaseConfig));

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const CELL = 60; // 540 / 9 = 60

// 駒定義
const pieceNames = ["fu", "to", "kyo", "nkyo", "keima", "nkeima", "gin", "ngin", "kin", "ou", "hisha", "ryu", "kaku", "uma"];
const img = {};
let imagesLoaded = 0;

// 画像読み込み
pieceNames.forEach(name => {
  img[name] = new Image();
  img[name].onload = () => {
    imagesLoaded++;
    if (imagesLoaded === pieceNames.length) draw();
  };
  img[name].src = `syogi_img/${name}.png`;
});

let state = { pieces: {} };

// 描画ロジック
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // 盤面グリッド
  ctx.strokeStyle = "#5d4037";
  for (let i = 0; i < 9; i++) {
    for (let j = 0; j < 9; j++) {
      ctx.strokeRect(i * CELL, j * CELL, CELL, CELL);
    }
  }

  // 駒描画
  for (const k in state.pieces) {
    const p = state.pieces[k];
    ctx.save();
    ctx.translate(p.x * CELL + CELL / 2, p.y * CELL + CELL / 2);
    if (p.owner === "gote") ctx.rotate(Math.PI);
    ctx.drawImage(img[p.type], -CELL / 2, -CELL / 2, CELL, CELL);
    ctx.restore();
  }
}

// データ受信
onValue(ref(db, "game"), snap => {
  if (snap.val()) {
    state = snap.val();
    draw();
  }
});
</script>
</body>
</html>
