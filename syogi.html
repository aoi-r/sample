<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>本格リアルタイム将棋</title>
</head>
<body style="margin:0; background:#f4e4bc; display:flex; justify-content:center;">

<canvas id="game"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDk7KNFdlp9zPtnixdNv96VtfKrELX1f8I",
  databaseURL: "https://syogi-cee67-default-rtdb.firebaseio.com",
  projectId: "syogi-cee67"
};
const db = getDatabase(initializeApp(firebaseConfig));

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 600;
canvas.height = 800;

const CELL = 60;
const img = {};
const pieceNames = ["fu", "to", "kyo", "nkyo", "keima", "nkeima", "gin", "ngin", "kin", "ou", "hisha", "ryu", "kaku", "uma"];

// 画像ロード完了後にゲーム開始
let loadedCount = 0;
pieceNames.forEach(name => {
  const i = new Image();
  i.onload = () => {
    loadedCount++;
    if (loadedCount === pieceNames.length) draw();
  };
  i.src = `syogi_img/${name}.png`;
  img[name] = i;
});

let state = { turn: "sente", pieces: {}, hands: { sente: [], gote: [] } };
let selected = null;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // 盤面描画
  for (let i = 0; i < 9; i++) {
    for (let j = 0; j < 9; j++) ctx.strokeRect(i * CELL, j * CELL + 100, CELL, CELL);
  }

  // 駒描画
  for (const k in state.pieces) {
    const p = state.pieces[k];
    ctx.save();
    ctx.translate(p.x * CELL + CELL / 2, p.y * CELL + CELL / 2 + 100);
    if (p.owner === "gote") ctx.rotate(Math.PI);
    // アスペクト比を保って描画
    const scale = Math.min(CELL/140, CELL/148);
    ctx.drawImage(img[p.type], -70*scale, -74*scale, 140*scale, 148*scale);
    ctx.restore();
  }

  // 持ち駒表示
  ctx.fillStyle = "black";
  ctx.font = "20px Arial";
  ctx.fillText("先手の持ち駒: " + state.hands.sente.join(","), 10, 750);
  ctx.fillText("後手の持ち駒: " + state.hands.gote.join(","), 10, 50);
}

// 簡易的なクリックイベント（盤面上の座標計算）
canvas.addEventListener("mousedown", e => {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / CELL);
  const y = Math.floor((e.clientY - rect.top - 100) / CELL);
  
  // ここに移動・成り・持ち駒のロジックを追加していく
  console.log(`Clicked: ${x}, ${y}`);
});

onValue(ref(db, "game"), snap => {
  if (snap.val()) state = snap.val();
  draw();
});
</script>
</body>
</html>
