<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本格リアルタイム将棋</title>
<style>
    body { background: #f4e4bc; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
    canvas { background: #f9d784; border: 5px solid #5d4037; touch-action: none; max-width: 100%; height: auto; }
    button { padding: 15px 30px; font-size: 18px; margin-bottom: 20px; background: #5d4037; color: white; border: none; border-radius: 5px; }
</style>
</head>
<body>
<button onclick="initGame()">盤面を初期化する</button>
<canvas id="game" width="540" height="540"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const db = getDatabase(initializeApp({
  apiKey: "AIzaSyDk7KNFdlp9zPtnixdNv96VtfKrELX1f8I",
  databaseURL: "https://syogi-cee67-default-rtdb.firebaseio.com",
  projectId: "syogi-cee67"
}));

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const CELL = 60;
const img = {};
const pieceNames = ["fu", "to", "kyo", "nkyo", "keima", "nkeima", "gin", "ngin", "kin", "ou", "hisha", "ryu", "kaku", "uma"];
pieceNames.forEach(name => { img[name] = new Image(); img[name].src = `syogi_img/${name}.png`; });

let state = { pieces: {}, turn: "sente" };
let selectedKey = null;
const promotionMap = { "fu":"to", "kyo":"nkyo", "keima":"nkeima", "gin":"ngin", "hisha":"ryu", "kaku":"uma" };

function isBlocked(p, tx, ty) {
  const dx = tx - p.x; const dy = ty - p.y;
  const sx = dx === 0 ? 0 : dx / Math.abs(dx);
  const sy = dy === 0 ? 0 : dy / Math.abs(dy);
  let x = p.x + sx; let y = p.y + sy;
  while (x !== tx || y !== ty) {
    if (Object.values(state.pieces).find(piece => piece.x === x && piece.y === y)) return true;
    x += sx; y += sy;
  }
  return false;
}

function canMove(p, tx, ty) {
  const dx = tx - p.x; const dy = ty - p.y;
  const dir = p.owner === "sente" ? -1 : 1;
  const target = Object.values(state.pieces).find(piece => piece.x === tx && piece.y === ty);
  if (target && target.owner === p.owner) return false;
  const absDx = Math.abs(dx); const absDy = Math.abs(dy);

  switch(p.type) {
    case "fu": return dx === 0 && dy === dir;
    case "hisha": return (dx === 0 || dy === 0) && !isBlocked(p, tx, ty);
    case "kaku": return absDx === absDy && !isBlocked(p, tx, ty);
    case "kyo": return dx === 0 && dy * dir < 0 && !isBlocked(p, tx, ty);
    case "keima": return absDx === 1 && dy === 2 * dir;
    case "gin": return absDx <= 1 && absDy <= 1 && (dx !== 0 || dy !== 0) && !(absDx === 1 && dy === -dir);
    case "kin": case "to": case "ngin": case "nkyo": case "nkeima":
      return absDx <= 1 && absDy <= 1 && !(absDx === 1 && dy === -dir);
    case "ou": return absDx <= 1 && absDy <= 1;
    case "ryu": return (dx === 0 || dy === 0 || (absDx === 1 && absDy === 1)) && !isBlocked(p, tx, ty);
    case "uma": return (absDx === absDy || (absDx <= 1 && absDy <= 1)) && !isBlocked(p, tx, ty);
    default: return false;
  }
}

canvas.addEventListener("mousedown", e => {
  const rect = canvas.getBoundingClientRect();
  const scale = canvas.width / rect.width;
  const x = Math.floor(((e.clientX - rect.left) * scale) / CELL);
  const y = Math.floor(((e.clientY - rect.top) * scale) / CELL);
  
  if (!selectedKey) {
    selectedKey = Object.keys(state.pieces).find(k => state.pieces[k].x === x && state.pieces[k].y === y && state.pieces[k].owner === state.turn);
  } else {
    const p = state.pieces[selectedKey];
    if (canMove(p, x, y)) {
      const targetKey = Object.keys(state.pieces).find(k => state.pieces[k].x === x && state.pieces[k].y === y);
      if (targetKey) delete state.pieces[targetKey];
      if (promotionMap[p.type] && (y < 3 || p.y < 3 || y > 5 || p.y > 5)) if (confirm("成りますか？")) p.type = promotionMap[p.type];
      p.x = x; p.y = y;
      state.turn = state.turn === "sente" ? "gote" : "sente";
      set(ref(db, "game"), state);
    }
    selectedKey = null;
  }
  draw();
});

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) ctx.strokeRect(i * CELL, j * CELL, CELL, CELL);
  for (const k in state.pieces) {
    const p = state.pieces[k];
    ctx.save();
    ctx.translate(p.x * CELL + CELL / 2, p.y * CELL + CELL / 2);
    if (p.owner === "gote") ctx.rotate(Math.PI);
    if (img[p.type]) ctx.drawImage(img[p.type], -CELL/2, -CELL/2, CELL, CELL);
    if (selectedKey === k) { ctx.strokeStyle = "red"; ctx.lineWidth = 3; ctx.strokeRect(-CELL/2, -CELL/2, CELL, CELL); }
    ctx.restore();
  }
}

window.initGame = () => {
  const p = {};
  const setup = (row, type, owner) => { for(let i=0; i<9; i++) p[`${owner}_${type}_${i}`] = {x:i, y:row, type:type, owner:owner}; };
  setup(6, "fu", "sente"); setup(2, "fu", "gote");
  p["s_ou"] = {x:4, y:8, type:"ou", owner:"sente"}; p["g_ou"] = {x:4, y:0, type:"ou", owner:"gote"};
  set(ref(db, "game"), { pieces: p, turn: "sente" });
};

onValue(ref(db, "game"), snap => { if(snap.val()) { state = snap.val(); draw(); } });
</script>
</body>
</html>
