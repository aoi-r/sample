<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>本格リアルタイム将棋</title>
<style>
    body { background: #f4e4bc; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
    /* キャンバスをスマホ画面幅に合わせつつ、アスペクト比を維持 */
    canvas { background: #f9d784; border: 4px solid #5d4037; width: 100%; max-width: 540px; touch-action: none; cursor: pointer; }
    button { padding: 12px 24px; margin: 10px; font-size: 16px; background: #5d4037; color: white; border: none; border-radius: 5px; }
</style>
</head>
<body>
<button onclick="initGame()">盤面を初期化する</button>
<canvas id="game" width="540" height="540"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const db = getDatabase(initializeApp({
  apiKey: "AIzaSyDk7KNFdlp9zPtnixdNv96VtfKrELX1f8I",
  databaseURL: "https://syogi-cee67-default-rtdb.firebaseio.com",
  projectId: "syogi-cee67"
}));

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const CELL = 60;
const img = {};
const pieceNames = ["fu", "to", "kyo", "nkyo", "keima", "nkeima", "gin", "ngin", "kin", "ou", "hisha", "ryu", "kaku", "uma"];
pieceNames.forEach(name => { img[name] = new Image(); img[name].src = `syogi_img/${name}.png`; });

let state = { pieces: {}, turn: "sente" };
let selectedKey = null;

// [修正] 描画座標を正しく補正
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // グリッド
  ctx.strokeStyle = "#5d4037";
  for (let i = 0; i < 9; i++) {
    for (let j = 0; j < 9; j++) ctx.strokeRect(i * CELL, j * CELL, CELL, CELL);
  }
  // 駒描画
  for (const k in state.pieces) {
    const p = state.pieces[k];
    ctx.save();
    // 駒の中心に移動して回転・描画
    ctx.translate(p.x * CELL + CELL / 2, p.y * CELL + CELL / 2);
    if (p.owner === "gote") ctx.rotate(Math.PI);
    if (img[p.type]) ctx.drawImage(img[p.type], -CELL/2, -CELL/2, CELL, CELL);
    
    // 選択枠
    if (selectedKey === k) {
      ctx.strokeStyle = "red";
      ctx.lineWidth = 4;
      ctx.strokeRect(-CELL/2 + 2, -CELL/2 + 2, CELL - 4, CELL - 4);
    }
    ctx.restore();
  }
}

// [修正] スマホ・PC共通のクリック位置計算
canvas.addEventListener("mousedown", e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = 540 / rect.width;
  const scaleY = 540 / rect.height;
  const x = Math.floor(((e.clientX - rect.left) * scaleX) / CELL);
  const y = Math.floor(((e.clientY - rect.top) * scaleY) / CELL);
  
  if (x < 0 || x > 8 || y < 0 || y > 8) return;

  if (!selectedKey) {
    selectedKey = Object.keys(state.pieces).find(k => state.pieces[k].x === x && state.pieces[k].y === y && state.pieces[k].owner === state.turn);
  } else {
    // ここに移動ロジック（省略していますが、前回のcanMoveとsetをそのまま使用）
    // (中略：前回のコードと同じでOKです)
    selectedKey = null;
  }
  draw();
});

// ... (initGame, canMove, onValue は前回のものをそのまま利用)
</script>
</body>
</html>
