<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crusade</title>
<style>
    body { background: #f4e4bc; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; font-family: sans-serif; user-select: none; }
    #watcherConsole { display: none; background: #5d4037; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; margin-bottom: 12px; align-items: center; gap: 15px; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    #joinBtn { background: #2e7d32; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    #joinBtn:hover { background: #1b5e20; }
    
    canvas { 
        background: #f9d784; 
        border: 4px solid #5d4037; 
        width: 100%; 
        max-width: 400px; 
        height: auto; 
        aspect-ratio: 540 / 720; 
        touch-action: none; 
        cursor: pointer; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
    }
    
    #controlPanel { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
    #resetBtn { padding: 10px 16px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 13px; background: #5d4037; color: white; }
    .waiting { background: #d32f2f !important; color: white; opacity: 0.8; }
    
    /* スキルミニボタンUI */
    .skillBtn { 
        width: 75px; 
        height: 45px; 
        border: 2px solid #5d4037; 
        border-radius: 6px; 
        font-weight: bold; 
        font-size: 12px; 
        color: white; 
        text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        cursor: pointer; 
        transition: 0.2s; 
        background-size: cover; 
        background-position: center;
        box-shadow: 0 3px 5px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #skillKanashibari { background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('syogi_img/kana.png'); }
    #skillKirigakure { background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('syogi_img/kiri.png'); }
    #skillSaisei { background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('syogi_img/saisei.png'); }
    
    .skillBtn:disabled { filter: grayscale(100%) brightness(50%); cursor: not-allowed; box-shadow: none; border-color: #777; }
    .skillBtn.active { border-color: #ff9100; box-shadow: 0 0 12px #ff9100; animation: pulse 1.5s infinite; }
    
    @keyframes pulse {
        0% { transform: scale(1); box-shadow: 0 0 4px #ff9100; }
        50% { transform: scale(1.04); box-shadow: 0 0 15px #ff9100; }
        100% { transform: scale(1); box-shadow: 0 0 4px #ff9100; }
    }
    
    /* 勝敗通知オーバーレイ */
    #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; font-size: 28px; font-weight: bold; z-index: 10; cursor: pointer; }
    #overlay span { font-size: 16px; color: #ccc; margin-top: 10px; }

    /* カード詳細モーダルUI */
    #cardModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 20; backdrop-filter: blur(4px); }
    .modalContent { background: #2c1d11; border: 4px solid #f4e4bc; border-radius: 12px; width: 90%; max-width: 340px; padding: 15px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); color: #f4e4bc; }
    .modalCardImg { width: 180px; height: 240px; border: 3px solid #f4e4bc; border-radius: 8px; background-size: cover; background-position: center; box-shadow: 0 5px 15px rgba(0,0,0,0.4); margin-bottom: 12px; }
    .modalTitle { font-size: 22px; font-weight: bold; margin-bottom: 4px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .modalFlavor { font-size: 11px; font-style: italic; color: #cca576; margin-bottom: 12px; text-align: center; line-height: 1.4; padding: 0 10px; }
    .modalDesc { background: rgba(0,0,0,0.3); border-radius: 6px; padding: 10px; font-size: 13px; line-height: 1.5; color: #f4e4bc; width: 100%; box-sizing: border-box; text-align: justify; margin-bottom: 15px; border: 1px solid #5d4037; }
    .modalBtns { display: flex; gap: 15px; width: 100%; }
    .modalBtn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; text-align: center; }
    .btnCancel { background: #757575; color: white; }
    .btnCancel:hover { background: #616161; }
    .btnUse { background: #e65100; color: white; box-shadow: 0 3px 6px rgba(0,0,0,0.3); }
    .btnUse:hover { background: #bf360c; }
</style>
</head>
<body>
<div id="watcherConsole">
  <span id="watcherStatus">観戦モード中</span>
  <button id="joinBtn">参戦する</button>
</div>

<div id="controlPanel">
  <button id="resetBtn">リセット申請</button>
  <button id="skillKanashibari" class="skillBtn">金縛り</button>
  <button id="skillKirigakure" class="skillBtn">霧隠れ</button>
  <button id="skillSaisei" class="skillBtn">懐柔</button>
</div>

<canvas id="game" width="540" height="720"></canvas>

<div id="overlay">
  <div id="winnerText"></div>
  <span>画面をタップして新しくゲームを始める</span>
</div>

<div id="cardModal">
  <div class="modalContent">
    <div id="modalCardImg" class="modalCardImg"></div>
    <div id="modalTitle" class="modalTitle"></div>
    <div id="modalFlavor" class="modalFlavor"></div>
    <div id="modalDesc" class="modalDesc"></div>
    <div class="modalBtns">
      <button id="modalCancelBtn" class="modalBtn btnCancel">戻る</button>
      <button id="modalUseBtn" class="modalBtn btnUse">使用する</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, update, onValue, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const db = getDatabase(initializeApp({
  apiKey: "AIzaSyDk7KNFdlp9zPtnixdNv96VtfKrELX1f8I",
  databaseURL: "https://syogi-cee67-default-rtdb.firebaseio.com",
  projectId: "syogi-cee67"
}));

let myId = null;
try {
  myId = sessionStorage.getItem("shogi_myId");
  if (!myId) {
    myId = Math.random().toString(36).slice(2) + Date.now().toString(36);
    sessionStorage.setItem("shogi_myId", myId);
  }
} catch (e) {
  myId = Math.random().toString(36).slice(2) + Date.now().toString(36);
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const CELL = 60;
const img = {};
const pieceNames = ["fu", "to", "kyo", "nkyo", "keima", "nkeima", "gin", "ngin", "kin", "ou", "hisha", "ryu", "kaku", "uma"];
pieceNames.forEach(name => { img[name] = new Image(); img[name].src = `syogi_img/${name}.png`; });

let state = { 
  pieces: {}, 
  hands: {sente: [], gote: []}, 
  turn: "sente", 
  resetReq: false, 
  resetSender: null, 
  winner: null, 
  senteId: null, 
  goteId: null, 
  lastMove: null,
  skills: {
    sente: { kanashibariUsed: false, kirigakureUsed: false, saiseiUsed: false, activeEffect: null, targetPieceKey: null },
    gote: { kanashibariUsed: false, kirigakureUsed: false, saiseiUsed: false, activeEffect: null, targetPieceKey: null }
  }
};
let presence = {}; 
let selected = { type: null, key: null, hIdx: null };
let lastResetReq = false;
let myRole = null;
let currentViewingSkill = null; 

const cardData = {
  kanashibari: {
    title: "金縛り",
    flavor: "「影より出でる漆黒の鎖が、敵の動きを完全に封じる。」",
    desc: "発動後、盤上にある【相手の駒】を1つ指定します。次のターン、相手はその駒を動かすことができなくなります。（使用後も自分の手番は継続します）",
    img: "syogi_img/kana.png"
  },
  kirigakure: {
    title: "霧隠れ",
    flavor: "「戦場を包み込む神聖なる白霧。姿を消し、刃を拒む。」",
    desc: "即座に発動します。次の相手のターンが終わるまで、盤上にあるあなたのすべての駒は、相手から取られない（侵入されない）状態になります。（使用後も自分の手番は継続します）",
    img: "syogi_img/kiri.png"
  },
  saisei: {
    title: "懐柔",
    flavor: "「因果を捻じ曲げる禁忌の術。敵の魂を自らの配下へと書き換える。」",
    desc: "発動後、盤上にある王（玉）以外の【相手の駒】を1つ指定します。その駒を盤上から消滅させ、自分の持ち駒（手駒）として直接追加します。（使用後も自分の手番は継続します）",
    img: "syogi_img/saisei.png"
  }
};

function generateUniqueId() {
  return 'p_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
}

function normalizeState(val) {
  if (!val) return val;
  if (!val.hands) val.hands = { sente: [], gote: [] };
  if (val.hands.sente && !Array.isArray(val.hands.sente)) val.hands.sente = Object.values(val.hands.sente);
  if (val.hands.gote && !Array.isArray(val.hands.gote)) val.hands.gote = Object.values(val.hands.gote);
  val.hands.sente = val.hands.sente || [];
  val.hands.gote = val.hands.gote || [];
  if (!val.pieces) val.pieces = {};
  return val;
}

function isBlocked(p, tx, ty) {
  const dx = tx - p.x, dy = ty - p.y;
  const sx = dx === 0 ? 0 : Math.sign(dx);
  const sy = dy === 0 ? 0 : Math.sign(dy);
  let cx = p.x + sx, cy = p.y + sy;
  while (cx !== tx || cy !== ty) {
    if (Object.values(state.pieces || {}).some(piece => piece.x === cx && piece.y === cy)) return true;
    cx += sx; cy += sy;
  }
  return false;
}

function canMove(p, tx, ty) {
  const activeSkills = state.skills || { sente: {}, gote: {} };
  const opponentRole = p.owner === "sente" ? "gote" : "sente";
  
  if (activeSkills[opponentRole]?.activeEffect === "kanashibari" && activeSkills[opponentRole]?.targetPieceKey) {
    const targetKey = Object.keys(state.pieces || {}).find(k => state.pieces[k] === p);
    if (targetKey === activeSkills[opponentRole].targetPieceKey) return false; 
  }

  const dx = tx - p.x, dy = ty - p.y;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  const dir = p.owner === "sente" ? -1 : 1;
  const target = Object.values(state.pieces || {}).find(piece => piece.x === tx && piece.y === ty);
  
  if (target && target.owner === p.owner) return false;
  if (target && target.owner !== p.owner) {
    if (activeSkills[target.owner]?.activeEffect === "kirigakure") return false;
  }

  switch(p.type) {
    case "fu": return dx === 0 && dy === dir;
    case "kyo": return dx === 0 && dy * dir > 0 && !isBlocked(p, tx, ty);
    case "keima": return absDx === 1 && dy === 2 * dir;
    case "gin": return (dy === dir && absDx <= 1) || (dy === -dir && absDx === 1);
    case "kin": case "to": case "nkyo": case "nkeima": case "ngin":
      return (dy === dir && absDx <= 1) || (dy === 0 && absDx === 1) || (dx === 0 && dy === -dir);
    case "ou": return absDx <= 1 && absDy <= 1 && (dx !== 0 || dy !== 0);
    case "hisha": return (dx === 0 || dy === 0) && (dx !== 0 || dy !== 0) && !isBlocked(p, tx, ty);
    case "kaku": return absDx === absDy && dx !== 0 && !isBlocked(p, tx, ty);
    case "ryu": return ((dx === 0 || dy === 0) && !isBlocked(p, tx, ty)) || (absDx === 1 && absDy === 1);
    case "uma": return (absDx === absDy && !isBlocked(p, tx, ty)) || (absDx <= 1 && absDy <= 1 && (dx !== 0 || dy !== 0));
    default: return false;
  }
}

function setupSkillButtons() {
  const isMyTurn = state.turn === myRole;
  const hasSelectedSkill = selected.type === 'skill';

  ["kanashibari", "kirigakure", "saisei"].forEach(skill => {
    const btnId = "skill" + skill.charAt(0).toUpperCase() + skill.slice(1);
    const btn = document.getElementById(btnId);
    if (!btn) return;

    if (!myRole || state.winner) {
      btn.disabled = true;
      btn.classList.remove("active");
      return;
    }

    const isUsed = state.skills?.[myRole]?.[skill + "Used"];
    if (isUsed || !isMyTurn) {
      btn.disabled = true;
      btn.classList.remove("active");
    } else {
      btn.disabled = false;
      if (hasSelectedSkill && selected.key === skill) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }
  });
}

["kanashibari", "kirigakure", "saisei"].forEach(skill => {
  const btnId = "skill" + skill.charAt(0).toUpperCase() + skill.slice(1);
  document.getElementById(btnId).addEventListener("click", () => {
    if (!myRole || state.turn !== myRole || state.skills?.[myRole]?.[skill + "Used"]) return;
    
    currentViewingSkill = skill;
    const data = cardData[skill];
    
    document.getElementById("modalCardImg").style.backgroundImage = `url('${data.img}')`;
    document.getElementById("modalTitle").innerText = data.title;
    document.getElementById("modalFlavor").innerText = data.flavor;
    document.getElementById("modalDesc").innerText = data.desc;
    
    document.getElementById("cardModal").style.display = "flex";
  });
});

document.getElementById("modalCancelBtn").addEventListener("click", () => {
  document.getElementById("cardModal").style.display = "none";
  currentViewingSkill = null;
});

document.getElementById("modalUseBtn").addEventListener("click", () => {
  document.getElementById("cardModal").style.display = "none";
  const skill = currentViewingSkill;
  currentViewingSkill = null;

  if (!skill || !myRole || state.turn !== myRole || state.skills?.[myRole]?.[skill + "Used"]) return;

  if (skill === "kirigakure") {
    state.skills[myRole].kirigakureUsed = true;
    state.skills[myRole].activeEffect = "kirigakure";
    selected = { type: null };
    set(ref(db, "game"), state);
  } else {
    selected = { type: 'skill', key: skill };
    const isSenteOnline = state.senteId ? (presence[state.senteId] === true) : false;
    const isGoteOnline = state.goteId ? (presence[state.goteId] === true) : false;
    draw(isSenteOnline, isGoteOnline);
  }
});

canvas.addEventListener("mousedown", e => {
  if (state.winner) return;
  if (myRole) {
    const opponentId = myRole === "sente" ? state.goteId : state.senteId;
    if (!opponentId) return; 
  }
  if (!myRole || state.turn !== myRole) return;

  const rect = canvas.getBoundingClientRect();
  let rectX = (e.clientX - rect.left) * (540 / rect.width);
  let rectY = (e.clientY - rect.top) * (720 / rect.height);

  if (myRole === "gote") { rectX = 540 - rectX; rectY = 720 - rectY; }

  const x = Math.floor(rectX / CELL);
  const y = Math.floor(rectY / CELL) - 1;

  const isSenteOnline = state.senteId ? (presence[state.senteId] === true) : false;
  const isGoteOnline = state.goteId ? (presence[state.goteId] === true) : false;

  if (selected.type === 'skill') {
    const targetKey = Object.keys(state.pieces || {}).find(k => state.pieces[k].x === x && state.pieces[k].y === y);
    
    if (selected.key === 'kanashibari') {
      if (targetKey && state.pieces[targetKey].owner !== myRole) {
        state.skills[myRole].kanashibariUsed = true;
        state.skills[myRole].activeEffect = "kanashibari";
        state.skills[myRole].targetPieceKey = targetKey;
        selected = { type: null }; 
        set(ref(db, "game"), state);
      } else {
        selected = { type: null };
        draw(isSenteOnline, isGoteOnline);
      }
      return;
    }
    
    if (selected.key === 'saisei') {
      if (targetKey && state.pieces[targetKey].owner !== myRole) {
        const captured = state.pieces[targetKey];
        if (captured.type === "ou") { alert("王は再生（強奪）できません！"); return; }
        
        state.skills[myRole].saiseiUsed = true;
        if (!state.hands) state.hands = { sente: [], gote: [] };
        if (!state.hands[myRole]) state.hands[myRole] = [];
        
        let baseType = captured.type;
        if (baseType === 'to') baseType = 'fu';
        else if (baseType === 'uma') baseType = 'kaku';
        else if (baseType === 'ryu') baseType = 'hisha';
        else if (baseType.startsWith('n')) baseType = baseType.slice(1);

        state.hands[myRole].push({ type: baseType });
        delete state.pieces[targetKey];
        
        selected = { type: null }; 
        set(ref(db, "game"), state);
      } else {
        selected = { type: null };
        draw(isSenteOnline, isGoteOnline);
      }
      return;
    }
  }

  const pKey = Object.keys(state.pieces || {}).find(k => state.pieces[k].x === x && state.pieces[k].y === y && state.pieces[k].owner === state.turn);

  if (pKey) { selected = {type: 'board', key: pKey}; draw(isSenteOnline, isGoteOnline); return; }

  if (y === 10 && state.turn === 'sente') {
      const idx = x; if (state.hands?.sente?.[idx]) { selected = {type: 'hand', hIdx: idx}; draw(isSenteOnline, isGoteOnline); return; }
  }
  if (y === -1 && state.turn === 'gote') {
      const idx = x; if (state.hands?.gote?.[idx]) { selected = {type: 'hand', hIdx: idx}; draw(isSenteOnline, isGoteOnline); return; }
  }

  if (selected.type) {
    const targetKey = Object.keys(state.pieces || {}).find(k => state.pieces[k].x === x && state.pieces[k].y === y);

    if (selected.type === 'board') {
      const p = state.pieces[selected.key];
      if (!canMove(p, x, y) || x < 0 || x > 8 || y < 0 || y > 8) { selected = { type: null }; draw(isSenteOnline, isGoteOnline); return; }
      
      if (targetKey && state.pieces[targetKey].owner !== p.owner) {
        const captured = state.pieces[targetKey];
        if (captured.type === "ou") state.winner = state.turn;
        if (!state.hands) state.hands = { sente: [], gote: [] };
        if (!state.hands[state.turn]) state.hands[state.turn] = [];
        
        let baseType = captured.type;
        if (baseType === 'to') baseType = 'fu';
        else if (baseType === 'uma') baseType = 'kaku';
        else if (baseType === 'ryu') baseType = 'hisha';
        else if (baseType.startsWith('n')) baseType = baseType.slice(1);

        state.hands[state.turn].push({type: baseType});
        delete state.pieces[targetKey];
      }

      const oldY = p.y;
      state.lastMove = { fromX: p.x, fromY: p.y, toX: x, toY: y };
      p.x = x; p.y = y;
      const isEnemyZone = (p.owner === "sente" && (y <= 2 || oldY <= 2)) || (p.owner === "gote" && (y >= 6 || oldY >= 6));
      const promotable = ["fu", "kyo", "keima", "gin", "hisha", "kaku"].includes(p.type);

      if (isEnemyZone && promotable) {
        const force = (p.type === "fu" && (y === 0 || y === 8)) || (p.type === "kyo" && (y === 0 || y === 8)) || (p.type === "keima" && (p.owner === "sente" ? y <= 1 : y >= 7));
        if (force || confirm("成りますか？")) {
          if (p.type === "fu") p.type = "to";
          else if (p.type === "kaku") p.type = "uma";
          else if (p.type === "hisha") p.type = "ryu";
          else if (!p.type.startsWith("n")) p.type = "n" + p.type;
        }
      }

    } else if (selected.type === 'hand') {
      if (x < 0 || x > 8 || y < 0 || y > 8 || targetKey) { selected = { type: null }; draw(isSenteOnline, isGoteOnline); return; }
      const h = state.hands[state.turn][selected.hIdx];
      if (h.type === 'fu') {
        const isNifu = Object.values(state.pieces || {}).some(p => p.x === x && p.type === 'fu' && p.owner === state.turn);
        if (isNifu) { alert("二歩は反則です！"); selected = { type: null }; draw(isSenteOnline, isGoteOnline); return; }
      }
      if ((h.type === 'fu' || h.type === 'kyo') && ((state.turn === 'sente' && y === 0) || (state.turn === 'gote' && y === 8))) { alert("そこには打てません！"); selected = { type: null }; draw(isSenteOnline, isGoteOnline); return; }
      if (h.type === 'keima' && ((state.turn === 'sente' && y <= 1) || (state.turn === 'gote' && y >= 7))) { alert("そこには打てません！"); selected = { type: null }; draw(isSenteOnline, isGoteOnline); return; }
      
      state.lastMove = { fromX: null, fromY: null, toX: x, toY: y };
      state.hands[state.turn].splice(selected.hIdx, 1);
      state.pieces[generateUniqueId()] = {x, y, type: h.type, owner: state.turn};
    }

    const opponentRole = state.turn === "sente" ? "gote" : "sente";
    if (state.skills?.[opponentRole]) {
      state.skills[opponentRole].activeEffect = null;
      state.skills[opponentRole].targetPieceKey = null;
    }

    state.turn = state.turn === "sente" ? "gote" : "sente";
    selected = {type: null};
    set(ref(db, "game"), state);
  }
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (state.resetReq) return;
  state.resetReq = true; state.resetSender = myId; set(ref(db, "game"), state);
});

document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('overlay').style.display = 'none';
  initBoard(true);
});

function initBoard(keepPlayers = false) {
  const p = {}; const line = ["kyo", "keima", "gin", "kin", "ou", "kin", "gin", "keima", "kyo"];
  line.forEach((t, i) => { p["s"+i] = {x:i, y:8, type:t, owner:"sente"}; p["g"+i] = {x:8-i, y:0, type:t, owner:"gote"}; });
  p["s_h"] = {x:1, y:7, type:"hisha", owner:"sente"}; p["g_h"] = {x:7, y:1, type:"hisha", owner:"gote"};
  p["s_k"] = {x:7, y:7, type:"kaku", owner:"sente"}; p["g_k"] = {x:1, y:1, type:"kaku", owner:"gote"};
  for(let i=0; i<9; i++) { p["sf"+i] = {x:i, y:6, type:"fu", owner:"sente"}; p["gf"+i] = {x:i, y:2, type:"fu", owner:"gote"}; }
  
  const newState = { 
    pieces: p, 
    hands: {sente:[], gote:[]}, 
    turn: "sente", 
    resetReq: false, 
    resetSender: null, 
    winner: null, 
    senteId: keepPlayers ? (state.senteId || null) : null, 
    goteId: keepPlayers ? (state.goteId || null) : null, 
    lastMove: null,
    skills: {
      sente: { kanashibariUsed: false, kirigakureUsed: false, saiseiUsed: false, activeEffect: null, targetPieceKey: null },
      gote: { kanashibariUsed: false, kirigakureUsed: false, saiseiUsed: false, activeEffect: null, targetPieceKey: null }
    }
  };
  set(ref(db, "game"), newState);
}

function draw(isSenteOnline, isGoteOnline) {
  ctx.clearRect(0, 0, 540, 720);
  ctx.save();
  if (myRole === "gote") { ctx.translate(540 / 2, 720 / 2); ctx.rotate(Math.PI); ctx.translate(-540 / 2, -720 / 2); }
  
  for (let i = 0; i < 9; i++) {
    for (let j = 0; j < 9; j++) {
      if (state.lastMove && ((state.lastMove.toX === i && state.lastMove.toY === j) || (state.lastMove.fromX === i && state.lastMove.fromY === j))) {
        ctx.fillStyle = "rgba(255, 140, 0, 0.35)"; ctx.fillRect(i * CELL, j * CELL + 60, CELL, CELL);
      }
      ctx.strokeStyle = "#5d4037"; ctx.lineWidth = 1; ctx.strokeRect(i * CELL, j * CELL + 60, CELL, CELL);
    }
  }

  if (selected.type && myRole === state.turn) {
    for (let i = 0; i < 9; i++) {
      for (let j = 0; j < 9; j++) {
        let highlight = false;
        let color = "rgba(0, 122, 255, 0.65)"; 

        if (selected.type === 'board') {
          const p = state.pieces[selected.key];
          if (p && canMove(p, i, j)) highlight = true;
        } else if (selected.type === 'hand') {
          const h = state.hands[state.turn]?.[selected.hIdx];
          const hasPiece = Object.values(state.pieces || {}).some(piece => piece.x === i && piece.y === j);
          
          if (h && !hasPiece) {
            let valid = true;
            if (h.type === 'fu') {
              const isNifu = Object.values(state.pieces || {}).some(p => p.x === i && p.type === 'fu' && p.owner === state.turn);
              if (isNifu) valid = false;
            }
            if ((h.type === 'fu' || h.type === 'kyo') && ((state.turn === 'sente' && j === 0) || (state.turn === 'gote' && j === 8))) valid = false;
            if (h.type === 'keima' && ((state.turn === 'sente' && j <= 1) || (state.turn === 'gote' && j >= 7))) valid = false;
            if (valid) highlight = true;
          }
        } else if (selected.type === 'skill' && (selected.key === 'kanashibari' || selected.key === 'saisei')) {
          const p = Object.values(state.pieces || {}).find(piece => piece.x === i && piece.y === j);
          if (p && p.owner !== myRole && p.type !== "ou") {
            highlight = true;
            color = "rgba(156, 39, 176, 0.65)"; 
          }
        }

        if (highlight) {
          ctx.fillStyle = color.replace("0.65", "0.15");
          ctx.fillRect(i * CELL, j * CELL + 60, CELL, CELL);
          ctx.beginPath();
          ctx.arc(i * CELL + CELL / 2, j * CELL + 60 + CELL / 2, CELL / 4, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        }
      }
    }
  }
  
  for (const k in (state.pieces || {})) {
    const p = state.pieces[k]; ctx.save(); let offsetY = 0;
    if (selected.key === k && selected.type === 'board') {
      offsetY = p.owner === "sente" ? -10 : 10;
      ctx.shadowColor = "rgba(0, 0, 0, 0.4)"; ctx.shadowBlur = 12; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 6;
    }
    ctx.translate(p.x * CELL + CELL/2, p.y * CELL + CELL/2 + 60 + offsetY);
    if (p.owner === "gote") ctx.rotate(Math.PI);
    if (img[p.type]) ctx.drawImage(img[p.type], -CELL/2, -CELL/2, CELL, CELL);
    
    const activeSkills = state.skills || { sente: {}, gote: {} };
    if ((activeSkills.sente?.activeEffect === "kanashibari" && activeSkills.sente?.targetPieceKey === k) ||
        (activeSkills.gote?.activeEffect === "kanashibari" && activeSkills.gote?.targetPieceKey === k)) {
      ctx.fillStyle = "rgba(121, 85, 72, 0.4)";
      ctx.fillRect(-CELL/2, -CELL/2, CELL, CELL);
      ctx.strokeStyle = "#795548"; ctx.lineWidth = 3;
      ctx.strokeRect(-CELL/2, -CELL/2, CELL, CELL);
    }

    if (selected.key === k && selected.type === 'board') { ctx.strokeStyle = "red"; ctx.lineWidth = 3; ctx.strokeRect(-CELL/2, -CELL/2, CELL, CELL); }
    ctx.restore();
  }
  
  (state.hands?.sente || []).forEach((h, i) => {
    ctx.save(); let offsetY = 0;
    if (selected.type === 'hand' && state.turn === 'sente' && selected.hIdx === i) { offsetY = -10; ctx.shadowColor = "rgba(0,0,0,0.4)"; ctx.shadowBlur = 10; }
    ctx.translate(i * CELL, 660 + offsetY); if (img[h.type]) ctx.drawImage(img[h.type], 0, 0, CELL, CELL);
    if (selected.type === 'hand' && state.turn === 'sente' && selected.hIdx === i) { ctx.strokeStyle = "red"; ctx.lineWidth = 3; ctx.strokeRect(0, 0, CELL, CELL); }
    ctx.restore();
  });

  (state.hands?.gote || []).forEach((h, i) => {
    ctx.save(); let offsetY = 0;
    if (selected.type === 'hand' && state.turn === 'gote' && selected.hIdx === i) { offsetY = 10; ctx.shadowColor = "rgba(0,0,0,0.4)"; ctx.shadowBlur = 10; }
    ctx.translate(i * CELL, 0 + offsetY); if (img[h.type]) ctx.drawImage(img[h.type], 0, 0, CELL, CELL);
    if (selected.type === 'hand' && state.turn === 'gote' && selected.hIdx === i) { ctx.strokeStyle = "red"; ctx.lineWidth = 3; ctx.strokeRect(0, 0, CELL, CELL); }
    ctx.restore();
  });

  const opRole = myRole === "sente" ? "gote" : "sente";
  if (state.skills?.[opRole]?.activeEffect === "kirigakure") {
    ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
    ctx.fillRect(0, 60, 540, 540);
  }

  ctx.restore();

  const btn = document.getElementById("resetBtn");
  if (state.resetReq) {
    if (state.resetSender === myId) { btn.innerText = "回答待ち.."; btn.className = "waiting"; btn.disabled = true; }
    else { btn.innerText = "リセット受信中"; btn.className = "waiting"; btn.disabled = false; }
  } else { btn.innerText = "リセット申請"; btn.className = ""; btn.disabled = false; }

  let opponentMissing = false;
  let opponentOffline = false;
  let opponentName = myRole === "sente" ? "後手" : "先手";

  if (myRole === "sente") {
    if (!state.goteId) opponentMissing = true;
    else if (!isGoteOnline) opponentOffline = true;
  } else if (myRole === "gote") {
    if (!state.senteId) opponentMissing = true;
    else if (!isSenteOnline) opponentOffline = true;
  }

  if ((opponentMissing || opponentOffline) && !state.winner && myRole) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(0, 0, 540, 720);
    ctx.fillStyle = opponentMissing ? "#0288d1" : "#d32f2f"; 
    ctx.fillRect(100, 320, 340, 80);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(100, 320, 340, 80);
    ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (opponentMissing) {
      ctx.fillText("対戦相手を待っています...", 270, 360);
    } else {
      ctx.fillText(`${opponentName}が切断されました`, 270, 345);
      ctx.font = "14px sans-serif"; ctx.fillText("復帰、または新規参戦を待っています...", 270, 375);
    }
  }

  // --- 【ここに追加】スキル対象選択中の案内バー表示 ---
  if (myRole && state.turn === myRole && selected.type === 'skill' && !state.winner) {
    ctx.fillStyle = "rgba(93, 64, 55, 0.95)"; ctx.fillRect(50, 335, 440, 50);
    ctx.strokeStyle = "#ff9100"; ctx.lineWidth = 2; ctx.strokeRect(50, 335, 440, 50);
    ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const txt = selected.key === 'kanashibari' 
        ? "金縛りの対象を選択 (他をタップで取消)" 
        : "懐柔の対象を選択 (他をタップで取消)";
    ctx.fillText(txt, 270, 360);
  }

  if (myRole && state.turn !== myRole && !state.winner && !opponentMissing && !opponentOffline) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.15)"; ctx.fillRect(0, 0, 540, 720);
    ctx.fillStyle = "rgba(93, 64, 55, 0.85)"; ctx.fillRect(160, 335, 220, 50);
    ctx.strokeStyle = "#f4e4bc"; ctx.lineWidth = 2; ctx.strokeRect(160, 335, 220, 50);
    ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("相手のターンです", 270, 360);
  }

  const overlayEl = document.getElementById('overlay');
  const winnerTxtEl = document.getElementById("winnerText");
  if (state.winner) {
    winnerTxtEl.innerText = (state.winner === "sente" ? "先手" : "後手") + "の勝ち！";
    overlayEl.style.display = 'flex';
  } else { 
    overlayEl.style.display = 'none'; 
  }

  setupSkillButtons();
}

function updateGameSystem() {
  if (!state || !state.pieces) return;

  const isSenteOnline = state.senteId ? (presence[state.senteId] === true) : false;
  const isGoteOnline = state.goteId ? (presence[state.goteId] === true) : false;

  if (state.senteId === myId) {
    myRole = "sente";
  } else if (state.goteId === myId) {
    myRole = "gote";
  } else {
    myRole = null;
  }

  const watcherConsole = document.getElementById("watcherConsole");
  const watcherStatus = document.getElementById("watcherStatus");
  const joinBtn = document.getElementById("joinBtn");

  if (!myRole) {
    watcherConsole.style.display = "flex";
    watcherStatus.innerText = `👀 観戦モード中 (${state.turn === "sente" ? "先手" : "後手"}の手番)`;
    
    let emptyRole = null;
    if (!state.senteId || !isSenteOnline) emptyRole = "sente";
    else if (!state.goteId || !isGoteOnline) emptyRole = "gote";
    
    if (emptyRole && !state.winner) {
      joinBtn.style.display = "inline-block";
      joinBtn.innerText = `⚔️ ${emptyRole === "sente" ? "先手" : "後手"}として参戦する`;
      
      joinBtn.onclick = () => {
        const hasZombie = state[emptyRole + "Id"] && !presence[state[emptyRole + "Id"]];
        const msg = hasZombie 
          ? `前のプレイヤーがオフラインのようです。席を引き継いで参戦しますか？`
          : `${emptyRole === "sente" ? "先手" : "後手"}の席が空いています。参戦しますか？`;

        if (confirm(msg)) {
          runTransaction(ref(db, `game/${emptyRole}Id`), (currentId) => {
            if (currentId === null || !presence[currentId]) {
              return myId;
            }
            return; 
          });
        }
      };
    } else { 
      joinBtn.style.display = "none"; 
    }
  } else {
    watcherConsole.style.display = "none";
  }
  
  draw(isSenteOnline, isGoteOnline); 
  
  if (state.resetReq && !lastResetReq && state.resetSender !== myId) {
    lastResetReq = true;
    setTimeout(() => {
      if (confirm("相手からリセット申請が届きました。承諾して盤面を初期化しますか？")) { initBoard(true); }
      else { update(ref(db), { "game/resetReq": false, "game/resetSender": null }); }
    }, 100);
  } else { lastResetReq = state.resetReq; }
}

onValue(ref(db, ".info/connected"), snap => {
  if (snap.val() === true) {
    onDisconnect(ref(db, `presence/${myId}`)).remove();
    set(ref(db, `presence/${myId}`), true);
  }
});

onValue(ref(db, "presence"), snap => {
  presence = snap.val() || {};
  updateGameSystem();
});

onValue(ref(db, "game"), snap => { 
  if(snap.val()) { 
    state = normalizeState(snap.val()); 
    updateGameSystem();
  } else { 
    initBoard(false); 
  }
});
</script>
</body>
